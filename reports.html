<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Financial Reports</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

  <h1>📊 FINANCIAL REPORTING SYSTEM</h1>

  <!-- REPORT CARDS -->
  <section class="cards">

    <div class="card blue">
      <h3>Total Members</h3>
      <p id="totalMembers">0</p>
    </div>

    <div class="card green">
      <h3>Total Savings</h3>
      <p id="totalSavings">0 ETB</p>
    </div>

    <div class="card orange">
      <h3>Total Loans</h3>
      <p id="totalLoans">0 ETB</p>
    </div>

    <div class="card purple">
      <h3>Total Repayments</h3>
      <p id="totalRepayments">0 ETB</p>
    </div>

  </section>

  <!-- EXTRA ANALYTICS -->
  <section class="cards" style="margin-top:20px;">

    <div class="card blue">
      <h3>Outstanding Loans</h3>
      <p id="outstandingLoans">0 ETB</p>
    </div>

    <div class="card green">
      <h3>Net Balance</h3>
      <p id="netBalance">0 ETB</p>
    </div>

  </section>

</div>
<div class="container">

  <h1>📊 FINANCIAL REPORTING SYSTEM</h1>

  <!-- REPORT CARDS HERE -->
  <section class="cards">
    ...
  </section>

  <!-- 📌 PDF EXPORT BUTTON (ADD HERE) -->
  <button class="btn primary" onclick="downloadPDF()">
    Export PDF
  </button>

  <!-- CHARTS -->
  <canvas id="financeChart"></canvas>

</div>
<script type="module" src="js/reports.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</body>
</html>
