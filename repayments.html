<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Loan Repayment System</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

  <h1>💱 LOAN REPAYMENT SYSTEM</h1>

  <!-- SEARCH LOAN MEMBER -->
  <div class="search-container">

    <input id="memberSearch"
           class="input"
           placeholder="Search member (Name / Phone / NID)">

    <button class="btn primary"
            onclick="searchLoans()">

      Search Loan

    </button>

  </div>

  <!-- SEARCH RESULTS -->
  <div id="searchResults"
       class="search-results"></div>

  <!-- SELECTED LOAN -->
  <div id="selectedLoan"
       class="selected-box">

    No loan selected

  </div>

  <!-- REPAYMENT INPUT -->
  <div class="form-box">

    <input id="payAmount"
           class="input"
           placeholder="Enter repayment amount">

    <button class="btn success"
            onclick="makeRepayment()">

      Pay

    </button>

  </div>

  <!-- LOAN TABLE -->
  <table class="table">

    <thead>

      <tr>

        <th>Member</th>
        <th>Loan</th>
        <th>Paid</th>
        <th>Remaining</th>
        <th>Status</th>

      </tr>

    </thead>

    <tbody id="loanTable">

    </tbody>

  </table>

</div>

<script type="module"src="js/repayments.js"></script>
<script type="module" src="js/auth-guard.js"></script>
</body>
</html>
