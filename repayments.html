<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Repayment System</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

  <h1>💱 LOAN REPAYMENT SYSTEM</h1>

  <!-- =========================
       SEARCH MEMBER LOAN
  ========================= -->
  <div class="search-container">

    <input id="memberSearch"
           class="input"
           placeholder="Search by Name / Phone / NID">

    <button class="btn primary"
            onclick="searchLoans()">

      Search

    </button>

  </div>

  <!-- SEARCH RESULTS -->
  <div id="searchResults"
       class="search-results"></div>

  <!-- SELECTED LOAN -->
  <div id="selectedLoan"
       class="selected-box">

    No loan selected

  </div>

  <!-- =========================
       REPAYMENT INPUT
  ========================= -->
  <div class="form-box">

    <input id="payAmount"
           class="input"
           type="number"
           placeholder="Enter repayment amount">

    <button class="btn success"
            onclick="makeRepayment()">

      Pay Now

    </button>

  </div>

  <!-- =========================
       LOAN TABLE
  ========================= -->
  <table class="table">

    <thead>

      <tr>
        <th>Member</th>
        <th>Loan</th>
        <th>Paid</th>
        <th>Remaining</th>
        <th>Penalty</th>
        <th>Status</th>
      </tr>

    </thead>

    <tbody id="loanTable"></tbody>

  </table>

</div>

<script type="module" src="js/repayments.js"></script>

</body>
</html>
