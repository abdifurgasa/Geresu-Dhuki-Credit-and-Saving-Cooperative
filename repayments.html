<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Loan Repayments</title>

<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>

<body>

<div class="layout">

  <aside class="sidebar"></aside>

  <main class="main">

    <div class="topbar">
      <h2>Loan Repayment</h2>
    </div>

    <section class="content">

      <!-- REPAYMENT FORM -->
      <div class="card">
        <h3>Make Repayment</h3>

        <input id="searchInput" placeholder="Search by Name / Phone / ID">

        <select id="loanSelect"></select>

        <input id="amount" type="number" placeholder="Repayment Amount">

        <button onclick="makeRepayment()">Pay</button>
      </div>

      <!-- TABLE -->
      <div class="card">
        <h3>Repayment History</h3>

        <table>
          <thead>
            <tr>
              <th>Member</th>
              <th>Amount</th>
              <th>Date</th>
            </tr>
          </thead>

          <tbody id="repaymentTable"></tbody>
        </table>
      </div>

    </section>

  </main>

</div>

<script type="module" src="js/repayments.js"></script>
<script src="js/layout.js"></script>

</body>
</html>
