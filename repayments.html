<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Repayment System</title>

</head>

<body>
<!-- =========================

========================= -->

       id="sidebar">

  <!-- TOGGLE -->

          onclick="toggleSidebar()">

    ☰

  </button>

  <!-- LOGO -->
  <h2 class="logo">

    🏦 SACCO

  </h2>

  <!-- NAVIGATION -->
  <nav class="nav">

    <a href="dashboard.html"
       class="nav-item">

      <span class="icon">📊</span>

      <span class="text">

        Dashboard

      </span>

    </a>

    <a href="members.html"
       class="nav-item active">

      <span class="icon">👥</span>

      <span class="text">

        Members

      </span>

    </a>

    <a href="savings.html"
       class="nav-item">

      <span class="icon">💰</span>

      <span class="text">

        Savings

      </span>

    </a>

    <a href="loans.html"
       class="nav-item">

      <span class="icon">🏦</span>

      <span class="text">

        Loans

      </span>

    </a>

    <a href="repayments.html"
       class="nav-item">

      <span class="icon">💵</span>

      <span class="text">

        Repayments

      </span>

    </a>

    <a href="transactions.html"
       class="nav-item">

      <span class="icon">💱</span>

      <span class="text">

        Transactions

      </span>

    </a>

    <a href="reports.html"
       class="nav-item">

      <span class="icon">📄</span>

      <span class="text">

        Reports

      </span>

    </a>

    <a href="users.html"
       class="nav-item">

      <span class="icon">👤</span>

      <span class="text">

        Users

      </span>

    </a>

    <a href="settings.html"
       class="nav-item">

      <span class="icon">⚙️</span>

      <span class="text">

        Settings

      </span>

    </a>

  </nav>

</aside>

<div class="container">

  <h1>💱 LOAN REPAYMENT SYSTEM</h1>

  <!-- =========================
       SEARCH MEMBER LOAN
  ========================= -->
  <div class="search-container">

    <input id="memberSearch"
           class="input"
           placeholder="Search by Name / Phone / NID">

    <button class="btn primary"
            onclick="searchLoans()">

      Search

    </button>

  </div>

  <!-- SEARCH RESULTS -->
  <div id="searchResults"
       class="search-results"></div>

  <!-- SELECTED LOAN -->
  <div id="selectedLoan"
       class="selected-box">

    No loan selected

  </div>

  <!-- =========================
       REPAYMENT INPUT
  ========================= -->
  <div class="form-box">

    <input id="payAmount"
           class="input"
           type="number"
           placeholder="Enter repayment amount">

    <button class="btn success"
            onclick="makeRepayment()">

      Pay Now

    </button>

  </div>

  <!-- =========================
       LOAN TABLE
  ========================= -->
  <table class="table">

    <thead>

      <tr>
        <th>Member</th>
        <th>Loan</th>
        <th>Paid</th>
        <th>Remaining</th>
        <th>Penalty</th>
        <th>Status</th>
      </tr>

    </thead>

    <tbody id="loanTable"></tbody>

  </table>

</div>

<script type="module" src="js/repayments.js"></script>

</body>
</html>
