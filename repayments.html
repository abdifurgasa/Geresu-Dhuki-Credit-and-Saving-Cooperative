<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Repayment System</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

  <!-- PAGE TITLE -->
  <h1>💱 LOAN REPAYMENT SYSTEM</h1>

  <!-- =========================
       SEARCH LOAN
  ========================= -->
  <div class="search-container">

    <input id="memberSearch"
           class="input"
           placeholder="Search by Name / Phone / NID">

    <button class="btn primary"
            onclick="searchLoans()">

      Search Loan

    </button>

  </div>

  <!-- SEARCH RESULTS -->
  <div id="searchResults"
       class="search-results"></div>

  <!-- SELECTED LOAN -->
  <div id="selectedLoan"
       class="selected-box">

    No loan selected

  </div>

  <!-- =========================
       REPAYMENT FORM
  ========================= -->
  <div class="form-box">

    <input id="payAmount"
           class="input"
           type="number"
           placeholder="Enter repayment amount">

    <button class="btn success"
            onclick="makeRepayment()">

      Pay Loan

    </button>

  </div>

  <!-- =========================
       LOAN SUMMARY TABLE
  ========================= -->
  <table class="table">

    <thead>

      <tr>

        <th>Member</th>
        <th>Total Loan</th>
        <th>Paid</th>
        <th>Remaining</th>
        <th>Status</th>

      </tr>

    </thead>

    <tbody id="loanTable"></tbody>

  </table>

</div>

<!-- =========================
     SCRIPT
========================= -->
<script type="module" src="js/repayments.js"></script>

</body>
</html>
