  <!-- SEARCH RESULTS -->
  <div id="searchResults" class="search-results"></div>

  <!-- SELECTED MEMBER -->
  <div id="selectedMember" class="selected-box">

  </div>

  <!-- TRANSACTION FORM -->
  <div class="form-box">

    <select id="transactionType" class="input">
      <option value="saving">Saving Deposit</option>
      <option value="repayment">Loan Repayment</option>
    </select>

    <input

      id="amount"
      class="input"
      placeholder="Amount"
    >

    <button class="btn success" onclick="submitTransaction()">
      Submit Transaction
    </button>

  </div>

  <!-- TRANSACTION LEDGER -->
  <h2 style="margin-top:30px;">Realtime Ledger</h2>

  <table class="table">

    <thead>
      <tr>
        <th>Member</th>
        <th>Type</th>
        <th>Amount</th>
        <th>Date</th>
        <th>Status</th>

    </thead>

    <tbody id="transactionTable"></tbody>
