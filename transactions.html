 <!-- TOGGLE -->

    <!-- MEMBERS -->

      <span class="text"
            data-i18n="members">

        Members

      </span>

    </a>

    <!-- SAVINGS -->
    <a href="savings.html"
       class="nav-item">

      <span class="icon">💰</span>

      <span class="text"
            data-i18n="savings">

        Savings

      </span>

    </a>

    <!-- LOANS -->
    <a href="loans.html"
       class="nav-item">

      <span class="icon">🏦</span>

      <span class="text"
            data-i18n="loans">

        Loans

      </span>

    </a>

    <!-- REPAYMENTS -->
    <a href="repayments.html"
       class="nav-item">

      <span class="icon">💵</span>

      <span class="text"
            data-i18n="repayments">

        Repayments

      </span>

    </a>

    <!-- TRANSACTIONS -->
    <a href="transactions.html"
       class="nav-item admin-only">

      <span class="icon">💱</span>

      <span class="text"
            data-i18n="transactions">

        Transactions

      </span>

    </a>
    
<!-- WITHDRAWALS -->
    <a href="withdrawals.html"
       class="nav-item admin-only">

      <span class="icon">💵</span>

      <span class="text"
            data-i18n="withdrawals">

        Withdrawals

      </span>

    </a>
    <!-- REPORTS -->
    <a href="reports.html"
       class="nav-item admin-only">

      <span class="icon">📄</span>

      <span class="text"
            data-i18n="reports">

        Reports

      </span>

    </a>

    <!-- USERS -->
    <a href="users.html"
       class="nav-item admin-only">

      <span class="icon">👤</span>

      <span class="text"
            data-i18n="users">

        Users

      </span>

    <!-- SETTINGS -->

      <span class="icon">⚙️</span>

      <span class="text"
            data-i18n="settings">

        Settings

      </span>

    </a>

  </nav>

</aside>

<div class="container">

  <h1>💱 TRANSACTION ENGINE</h1>

  <!-- SEARCH MEMBER -->
  <div class="search-container">

    <input
      type="text"
      id="memberSearch"
      class="input"
      placeholder="Search member by name / phone / NID"
    >

    <button class="btn primary" onclick="searchMembers()">
      Search
    </button>

  </div>

  <!-- SEARCH RESULTS -->
  <div id="searchResults" class="search-results"></div>

  <!-- SELECTED MEMBER -->
  <div id="selectedMember" class="selected-box">
    No member selected
  </div>

  <!-- TRANSACTION FORM -->
  <div class="form-box">

    <select id="transactionType" class="input">
      <option value="saving">Saving Deposit</option>
      <option value="repayment">Loan Repayment</option>
    </select>

    <input
      type="number"
      id="amount"
      class="input"
      placeholder="Amount"
    >

    <button class="btn success" onclick="submitTransaction()">
      Submit Transaction
    </button>

  </div>

  <!-- TRANSACTION LEDGER -->
  <h2 style="margin-top:30px;">Realtime Ledger</h2>

  <table class="table">

    <thead>
      <tr>
        <th>Member</th>
        <th>Type</th>
        <th>Amount</th>
        <th>Date</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody id="transactionTable"></tbody>

  </table>

</div>

<script type="module" src="js/transactions.js"></script>

</body>
</html>
