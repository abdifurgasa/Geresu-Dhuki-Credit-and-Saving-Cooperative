<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

  <h1>💱 TRANSACTION ENGINE</h1>

  <!-- SEARCH MEMBER -->
  <div class="search-container">

    <input
      type="text"
      id="memberSearch"
      class="input"
      placeholder="Search member by name / phone / NID"
    >

    <button class="btn primary" onclick="searchMembers()">
      Search
    </button>

  </div>

  <!-- SEARCH RESULTS -->
  <div id="searchResults" class="search-results"></div>

  <!-- SELECTED MEMBER -->
  <div id="selectedMember" class="selected-box">
    No member selected
  </div>

  <!-- TRANSACTION FORM -->
  <div class="form-box">

    <select id="transactionType" class="input">
      <option value="saving">Saving Deposit</option>
      <option value="repayment">Loan Repayment</option>
    </select>

    <input
      type="number"
      id="amount"
      class="input"
      placeholder="Amount"
    >

    <button class="btn success" onclick="submitTransaction()">
      Submit Transaction
    </button>

  </div>

  <!-- TRANSACTION LEDGER -->
  <h2 style="margin-top:30px;">Realtime Ledger</h2>

  <table class="table">

    <thead>
      <tr>
        <th>Member</th>
        <th>Type</th>
        <th>Amount</th>
        <th>Date</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody id="transactionTable"></tbody>

  </table>

</div>

<script type="module" src="js/transactions.js"></script>

</body>
</html>
