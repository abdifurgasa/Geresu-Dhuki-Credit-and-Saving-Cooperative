<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Geresu Dhuki SACCO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #f9fafc 0%, #f0f4fa 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      max-width: 440px;
      width: 100%;
    }

    .login-card {
      background: white;
      border-radius: 40px;
      padding: 48px 40px;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(203, 213, 225, 0.4);
      text-align: center;
    }

    .logo {
      margin-bottom: 32px;
    }
    .logo i {
      font-size: 48px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .logo h2 {
      font-family: 'Poppins', sans-serif;
      font-size: 1.8rem;
      margin-top: 12px;
      background: linear-gradient(135deg, #1e293b, #3b82f6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .logo p {
      color: #64748b;
      font-size: 0.85rem;
    }

    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .input-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 6px;
    }
    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 28px;
      font-size: 0.9rem;
      transition: 0.2s;
      outline: none;
      font-family: 'Inter', sans-serif;
    }
    .input-group input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }

    .login-btn {
      width: 100%;
      background: linear-gradient(95deg, #2563eb, #3b82f6);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 8px;
    }
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -8px #3b82f6;
    }

    .error-message {
      background: #fee2e2;
      color: #dc2626;
      padding: 12px;
      border-radius: 30px;
      font-size: 0.8rem;
      margin: 16px 0;
      display: none;
    }

    .register-link {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #475569;
    }
    .register-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    .demo-note {
      margin-top: 20px;
      font-size: 0.7rem;
      color: #94a3b8;
      background: #f8fafc;
      padding: 12px;
      border-radius: 20px;
    }
  </style>
</head>
<body>
<div class="login-container">
  <div class="login-card">
    <div class="logo">
      <i class="fas fa-hand-holding-heart"></i>
      <h2>SACCO Portal</h2>
      <p>Geresu Dhuki Banking System</p>
    </div>

    <div class="error-message" id="errorMsg"></div>

    <div class="input-group">
      <label><i class="fas fa-envelope"></i> Email</label>
      <input type="email" id="email" placeholder="admin@sacco.com" autocomplete="email">
    </div>

    <div class="input-group">
      <label><i class="fas fa-lock"></i> Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <button class="login-btn" id="loginBtn"><i class="fas fa-arrow-right-to-bracket"></i> Sign In</button>

    <div class="register-link">
      Don't have an account? <a href="#" id="showRegister">Create account</a>
    </div>

    <div class="demo-note">
      <i class="fas fa-info-circle"></i> Demo credentials: admin@sacco.com / password123
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // Firebase config (same as in firebase-config.js)
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('loginBtn');
  const errorDiv = document.getElementById('errorMsg');
  const registerLink = document.getElementById('showRegister');

  let isRegisterMode = false;

  function showError(msg) {
    errorDiv.style.display = 'block';
    errorDiv.textContent = msg;
    setTimeout(() => { errorDiv.style.display = 'none'; }, 4000);
  }

  async function handleAuth() {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) {
      showError('Please enter email and password');
      return;
    }
    try {
      if (isRegisterMode) {
        await createUserWithEmailAndPassword(auth, email, password);
        // after registration, auto sign-in
      }
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = 'index.html';
    } catch (error) {
      let msg = error.message;
      if (error.code === 'auth/user-not-found') msg = 'User not found. Please register first.';
      else if (error.code === 'auth/wrong-password') msg = 'Incorrect password.';
      else if (error.code === 'auth/email-already-in-use') msg = 'Email already exists. Try logging in.';
      showError(msg);
    }
  }

  loginBtn.addEventListener('click', handleAuth);
  registerLink.addEventListener('click', (e) => {
    e.preventDefault();
    isRegisterMode = !isRegisterMode;
    if (isRegisterMode) {
      loginBtn.innerHTML = '<i class="fas fa-user-plus"></i> Sign Up';
      registerLink.innerHTML = 'Already have an account? <a href="#">Login</a>';
    } else {
      loginBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Sign In';
      registerLink.innerHTML = 'Don\'t have an account? <a href="#">Create account</a>';
    }
  });

  // optional: press Enter to submit
  const inputs = [emailInput, passwordInput];
  inputs.forEach(inp => inp.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleAuth(); }));
</script>
</body>
</html>
