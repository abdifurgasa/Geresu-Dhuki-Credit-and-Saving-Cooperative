<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SACCO | Login</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}body{background:linear-gradient(135deg,#1a3c34,#0e2a24);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}.login-container{background:#fff;border-radius:20px;box-shadow:0 25px 50px rgba(0,0,0,0.3);width:100%;max-width:420px;padding:40px}.login-header{text-align:center;margin-bottom:35px}.logo-circle{width:80px;height:80px;background:#1a3c34;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}.logo-circle i{font-size:40px;color:#ffc107}.login-header h1{color:#1a3c34;font-size:28px}.form-group{margin-bottom:22px}.form-group label{display:block;margin-bottom:8px;color:#333;font-weight:500}.form-group input{width:100%;padding:12px 15px;border:2px solid #e0e0e0;border-radius:12px;font-size:15px}.form-group input:focus{outline:none;border-color:#ffc107}.login-btn{width:100%;padding:14px;background:#1a3c34;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}.login-btn:hover{background:#0e2a24}.alert{padding:12px;border-radius:12px;margin-bottom:20px;display:none}.alert-error{background:#f8d7da;color:#721c24;display:block}.alert-success{background:#d4edda;color:#155724;display:block}
</style></head>
<body><div class="login-container"><div class="login-header"><div class="logo-circle"><i class="fas fa-piggy-bank"></i></div><h1>SACCO Banking</h1><p>Login to your account</p></div><div id="alert" class="alert"></div><form id="loginForm"><div class="form-group"><label>Email</label><input type="email" id="email" placeholder="admin@sacco.com" value="abdifurgasa20@gmail.com"></div><div class="form-group"><label>Password</label><input type="password" id="password" placeholder="••••••••" value="Admin123!"></div><button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login</button></form></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { firebaseConfig } from "./js/firebase-config.js";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
onAuthStateChanged(auth, (user) => { if(user) window.location.href='dashboard.html'; });
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const alertDiv = document.getElementById('alert');
    const btn = e.target.querySelector('button');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
    btn.disabled = true;
    try {
        let userCredential;
        try { userCredential = await signInWithEmailAndPassword(auth, email, password); }
        catch(err){
            if(err.code === 'auth/user-not-found'){
                userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, "users", userCredential.user.uid), { email, fullName: "Admin User", role: "admin", createdAt: new Date() });
                alertDiv.className = "alert alert-success";
                alertDiv.textContent = "Account created! Logging in...";
            } else throw err;
        }
        alertDiv.className = "alert alert-success";
        alertDiv.textContent = "Login successful! Redirecting...";
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
    } catch (error) {
        alertDiv.className = "alert alert-error";
        alertDiv.textContent = error.message;
    } finally {
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
        btn.disabled = false;
    }
});
</script></body></html>
