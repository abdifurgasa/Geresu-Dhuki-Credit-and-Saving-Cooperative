<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="auth.welcome">SACCO | Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a3c34, #0e2a24);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }
        
        .logo-circle {
            width: 80px;
            height: 80px;
            background: #1a3c34;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        
        .logo-circle i {
            font-size: 40px;
            color: #ffc107;
        }
        
        .login-header h1 {
            color: #1a3c34;
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        
        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
        }
        
        .form-group {
            margin-bottom: 22px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #ffc107;
            box-shadow: 0 0 0 3px rgba(255,193,7,0.1);
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #1a3c34;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .login-btn:hover {
            background: #0e2a24;
            transform: translateY(-2px);
        }
        
        .demo-card {
            margin-top: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #e0e0e0;
        }
        
        .demo-card p {
            font-size: 12px;
            color: #666;
            margin: 5px 0;
        }
        
        .alert {
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }
    </style>
</head>
<body>
    <select id="languageSwitcher" class="language-selector">
        <option value="en">English</option>
        <option value="om">Afaan Oromo</option>
        <option value="am">አማርኛ</option>
    </select>
    
    <div class="login-container">
        <div class="login-header">
            <div class="logo-circle">
                <i class="fas fa-piggy-bank"></i>
            </div>
            <h1 data-i18n="auth.welcome">SACCO Banking</h1>
            <p data-i18n="auth.login">Login to your account</p>
        </div>
        
        <div id="alert" class="alert"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label data-i18n="auth.email">Email Address</label>
                <input type="email" id="email" placeholder="admin@sacco.com" value="abdifurgasa20@gmail.com">
            </div>
            
            <div class="form-group">
                <label data-i18n="auth.password">Password</label>
                <input type="password" id="password" placeholder="••••••••" value="Admin123!">
            </div>
            
            <button type="submit" class="login-btn" data-i18n="auth.login">Login</button>
        </form>
        
        <div class="demo-card">
            <p class="demo-title">📋 Login Credentials</p>
            <p>Email: <strong>abdifurgasa20@gmail.com</strong></p>
            <p>Password: <strong>Admin123!</strong></p>
            <p style="font-size: 11px; margin-top: 8px;">✅ User will be auto-created if not exists</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { initI18n, setLanguage, t } from './js/i18n.js';
        
        // 🔴 REPLACE WITH YOUR FIREBASE CONFIGURATION 🔴
     const firebaseConfig = {
        apiKey: "AIzaSyCS-3e_WqGHNycDgvlXVkInaynTnvnplYE",
        authDomain: "geresu-dhuki-sacco.firebaseapp.com",
        projectId: "geresu-dhuki-sacco",
        storageBucket: "geresu-dhuki-sacco.firebasestorage.app",
        messagingSenderId: "944934938425",
        appId: "1:944934938425:web:caef23f2f3bb34c843eae8",
        measurementId: "G-QRHNWMZMXC"
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Initialize i18n
        initI18n();
        
        // Check if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });
        
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const alertDiv = document.getElementById('alert');
        
        async function createUserInFirestore(user, userData) {
            try {
                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    email: user.email,
                    fullName: userData.name || "Abdi Furgasa",
                    role: userData.role || "admin",
                    status: "active",
                    createdAt: new Date(),
                    updatedAt: new Date()
                });
                console.log("User created in Firestore");
            } catch (error) {
                console.error("Error creating user in Firestore:", error);
            }
        }
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            if (!email || !password) {
                showAlert('Please enter both email and password', 'error');
                return;
            }
            
            const submitBtn = form.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            submitBtn.disabled = true;
            
            try {
                // Try to sign in first
                try {
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    console.log('Login successful:', userCredential.user.email);
                    showAlert('Login successful! Redirecting...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                    
                } catch (signInError) {
                    // If user doesn't exist, create them
                    if (signInError.code === 'auth/user-not-found') {
                        showAlert('User not found. Creating new account...', 'info');
                        
                        try {
                            // Create new user
                            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                            const user = userCredential.user;
                            
                            // Update profile with name
                            await updateProfile(user, {
                                displayName: "Abdi Furgasa"
                            });
                            
                            // Create user document in Firestore
                            await createUserInFirestore(user, {
                                name: "Abdi Furgasa",
                                role: "admin"
                            });
                            
                            console.log('User created successfully:', user.email);
                            showAlert('Account created! Logging in...', 'success');
                            
                            setTimeout(() => {
                                window.location.href = 'dashboard.html';
                            }, 1500);
                            
                        } catch (createError) {
                            console.error('Create user error:', createError);
                            showAlert('Error creating account: ' + createError.message, 'error');
                        }
                        
                    } else if (signInError.code === 'auth/wrong-password') {
                        showAlert('Wrong password. Please try again.', 'error');
                    } else if (signInError.code === 'auth/invalid-email') {
                        showAlert('Invalid email format.', 'error');
                    } else {
                        showAlert('Login failed: ' + signInError.message, 'error');
                    }
                }
                
            } catch (error) {
                console.error('Unexpected error:', error);
                showAlert('An unexpected error occurred', 'error');
                
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
        
        function showAlert(message, type) {
            alertDiv.textContent = message;
            alertDiv.className = `alert alert-${type}`;
            
            setTimeout(() => {
                alertDiv.style.display = 'none';
                alertDiv.className = 'alert';
            }, 4000);
        }
    </script>
</body>
</html>
