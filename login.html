<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACCO Banking System | Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a3c34, #0e2a24);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header .logo {
            width: 80px;
            height: 80px;
            background: #1a3c34;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        
        .login-header .logo i {
            font-size: 40px;
            color: #ffc107;
        }
        
        .login-header h1 {
            color: #1a3c34;
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #ffc107;
            box-shadow: 0 0 0 3px rgba(255,193,7,0.1);
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #1a3c34;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .login-btn:hover {
            background: #0e2a24;
            transform: translateY(-2px);
        }
        
        .forgot-password {
            text-align: center;
            margin-top: 15px;
        }
        
        .forgot-password a {
            color: #1a3c34;
            text-decoration: none;
            font-size: 14px;
        }
        
        .alert {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <select id="languageSwitcher" class="language-selector">
        <option value="en">English</option>
        <option value="om">Afaan Oromo</option>
        <option value="am">አማርኛ</option>
    </select>
    
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-piggy-bank"></i>
            </div>
            <h1 data-i18n="nav.dashboard">SACCO Banking</h1>
            <p data-i18n="auth.login">Login to your account</p>
        </div>
        
        <div id="alert" class="alert"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label data-i18n="auth.username">Email Address</label>
                <input type="email" id="email" placeholder="admin@sacco.com" required>
            </div>
            
            <div class="form-group">
                <label data-i18n="auth.password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="login-btn" data-i18n="auth.login">Login</button>
            
            <div class="forgot-password">
                <a href="#" onclick="resetPassword()" data-i18n="auth.forgotPassword">Forgot Password?</a>
            </div>
        </form>
    </div>

    <script type="module">
        import { auth, signInWithEmailAndPassword, sendPasswordResetEmail } from './js/firebase.js';
        import { setLanguage, getCurrentLanguage, t } from './js/i18n.js';
        
        // Language switcher
        const languageSwitcher = document.getElementById('languageSwitcher');
        languageSwitcher.value = localStorage.getItem('sacco_language') || 'en';
        languageSwitcher.addEventListener('change', (e) => {
            setLanguage(e.target.value);
            updatePageTexts();
        });
        
        function updatePageTexts() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.textContent = t(key);
            });
        }
        
        // Login form
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertDiv = document.getElementById('alert');
            
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                console.log('Login successful:', userCredential.user);
                
                alertDiv.className = 'alert alert-success';
                alertDiv.style.display = 'block';
                alertDiv.textContent = t('msg.loginSuccess');
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
                
            } catch (error) {
                console.error('Login error:', error);
                alertDiv.className = 'alert alert-error';
                alertDiv.style.display = 'block';
                
                if (error.code === 'auth/user-not-found') {
                    alertDiv.textContent = 'User not found. Please check your email.';
                } else if (error.code === 'auth/wrong-password') {
                    alertDiv.textContent = 'Wrong password. Please try again.';
                } else {
                    alertDiv.textContent = 'Login failed: ' + error.message;
                }
            }
        });
        
        // Reset password
        window.resetPassword = async () => {
            const email = prompt('Enter your email address to reset password:');
            if (email) {
                try {
                    await sendPasswordResetEmail(auth, email);
                    alert('Password reset email sent! Check your inbox.');
                } catch (error) {
                    alert('Error: ' + error.message);
                }
            }
        };
        
        updatePageTexts();
    </script>
</body>
</html>
