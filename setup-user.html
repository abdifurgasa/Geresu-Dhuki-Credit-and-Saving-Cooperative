<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Admin User</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a3c34, #0e2a24);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
        }
        button {
            background: #1a3c34;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .info { color: #17a2b8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Setup Admin User</h1>
        <p>Create the admin user in Firebase Authentication</p>
        
        <div id="result"></div>
        
        <button onclick="createUser()">Create Admin User</button>
        <button onclick="window.location.href='login.html'">Go to Login</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        window.createUser = async () => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p class="info">Creating user...</p>';
            
            try {
                // Create user in Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, "abdifurgasa20@gmail.com", "Admin123!");
                const user = userCredential.user;
                
                // Create user document in Firestore
                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    email: "abdifurgasa20@gmail.com",
                    fullName: "Abdi Furgasa",
                    role: "admin",
                    status: "active",
                    createdAt: new Date()
                });
                
                resultDiv.innerHTML = `
                    <p class="success">✅ User created successfully!</p>
                    <p><strong>Email:</strong> abdifurgasa20@gmail.com</p>
                    <p><strong>Password:</strong> Admin123!</p>
                    <p><strong>Name:</strong> Abdi Furgasa</p>
                    <p><strong>Role:</strong> Admin</p>
                `;
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (error) {
                console.error('Error:', error);
                if (error.code === 'auth/email-already-in-use') {
                    resultDiv.innerHTML = '<p class="info">⚠️ User already exists! You can login directly.</p><button onclick="window.location.href=\'login.html\'">Go to Login</button>';
                } else {
                    resultDiv.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
                }
            }
        };
    </script>
</body>
</html>
