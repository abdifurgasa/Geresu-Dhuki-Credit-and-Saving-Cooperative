<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Savings Module</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

  <h1>💰 Savings System</h1>

  <!-- MEMBER SEARCH -->
  <input id="searchMember" class="input"
         placeholder="Search Member (Name / Phone / NID)">

  <div id="results"></div>

  <!-- SELECTED MEMBER -->
  <div id="selectedBox" class="selected-box">
    No member selected
  </div>

  <!-- DEPOSIT FORM -->
  <input id="amount" class="input" type="number" placeholder="Enter amount">

  <button class="btn success" onclick="deposit()">Deposit</button>

  <!-- HISTORY -->
  <h3>Transaction History</h3>
  <table class="table">
    <thead>
      <tr>
        <th>Member</th>
        <th>Amount</th>
        <th>Date</th>
      </tr>
    </thead>

    <tbody id="historyTable"></tbody>
  </table>

</div>

<script type="module" src="js/savings.js"></script>

</body>
</html>
