<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SACCO | Savings</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head>
<body><div class="sidebar"></div><div class="main-content"><div class="header"></div><div id="globalAlert" class="alert"></div>
<div class="action-buttons"><button id="recordBtn" class="btn-primary"><i class="fas fa-plus"></i> Record Savings</button></div>
<div class="data-table"><table><thead><tr><th>Member</th><th>Amount (ETB)</th><th>Previous Balance</th><th>New Balance</th><th>Date</th></tr></thead><tbody id="savingsList"><tr><td colspan="5" class="loading">Loading...</td></tr></tbody></table></div></div>
<div id="savingsModal" class="modal"><div class="modal-content"><span class="close" onclick="closeModal()">&times;</span><h2>Record Savings</h2><select id="memberSelect"></select><input type="number" id="amount" placeholder="Amount"><button id="saveSavingsBtn">Save</button></div></div>
<script type="module">
import { initLayout, db, collection, getDocs, addDoc, updateDoc, doc, Timestamp, formatCurrency, showAlert } from "./js/app.js";
initLayout();
let members=[];
async function loadMembersForSelect(){
    const snap=await getDocs(collection(db,"members"));
    members=[];
    snap.forEach(d=>members.push({id:d.id,...d.data()}));
    const select=document.getElementById('memberSelect');
    select.innerHTML='<option value="">Select Member</option>';
    members.forEach(m=>{select.innerHTML+=`<option value="${m.id}" data-balance="${m.savingsBalance||0}">${m.fullName} (Balance: ${formatCurrency(m.savingsBalance||0)})</option>`;});
}
async function loadSavings(){
    const snap=await getDocs(collection(db,"savings"));
    const tbody=document.getElementById('savingsList');
    if(snap.empty){tbody.innerHTML='<tr><td colspan="5">No records</td></tr>';return;}
    tbody.innerHTML='';
    for(const docSnap of snap.docs){
        const s=docSnap.data();
        const member=members.find(m=>m.id===s.memberId);
        tbody.innerHTML+=`<tr><td>${member?member.fullName:'Unknown'}</td><td>${formatCurrency(s.amount)}</td><td>${formatCurrency(s.previousBalance||0)}</td><td>${formatCurrency(s.newBalance||s.amount)}</td><td>${new Date(s.createdAt?.toDate()).toLocaleDateString()}</td></tr>`;
    }
}
document.getElementById('recordBtn').onclick=async()=>{await loadMembersForSelect();document.getElementById('savingsModal').style.display='flex';};
document.getElementById('saveSavingsBtn').onclick=async()=>{
    const memberId=document.getElementById('memberSelect').value;
    const amount=parseFloat(document.getElementById('amount').value);
    if(!memberId||!amount||amount<=0){showAlert('Select member and valid amount');return;}
    const member=members.find(m=>m.id===memberId);
    const prevBalance=member.savingsBalance||0;
    const newBalance=prevBalance+amount;
    await addDoc(collection(db,"savings"),{memberId,memberName:member.fullName,amount,previousBalance:prevBalance,newBalance,paymentMethod:'cash',month:new Date().getMonth()+1,year:new Date().getFullYear(),createdAt:Timestamp.now()});
    await updateDoc(doc(db,"members",memberId),{savingsBalance:newBalance});
    showAlert('Savings recorded','success');
    document.getElementById('savingsModal').style.display='none';
    document.getElementById('amount').value='';
    loadSavings();
    window.dispatchEvent(new Event('storage'));
};
window.closeModal=()=>{document.getElementById('savingsModal').style.display='none';};
loadSavings();
</script></body></html>
