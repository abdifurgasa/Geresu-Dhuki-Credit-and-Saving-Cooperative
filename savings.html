<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Savings</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

    <h2 class="logo">SACCO</h2>

    <nav class="nav">
      <a href="dashboard.html" class="nav-item"><span class="icon">📊</span><span class="text">Dashboard</span></a>
      <a href="members.html" class="nav-item"><span class="icon">👥</span><span class="text">Members</span></a>
      <a href="savings.html" class="nav-item active"><span class="icon">💰</span><span class="text">Savings</span></a>
      <a href="loans.html" class="nav-item"><span class="icon">🏦</span><span class="text">Loans</span></a>
      <a href="reports.html" class="nav-item"><span class="icon">📄</span><span class="text">Reports</span></a>
    </nav>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <h1>Savings</h1>

    <!-- DEPOSIT FORM -->
    <div class="card-form">

      <select id="memberSelect"></select>

      <input type="number" id="amount" placeholder="Enter amount">

      <button onclick="addSaving()">Deposit</button>

    </div>

    <!-- TOTAL INFO -->
    <div class="summary">
      <h3>Total Savings: <span id="totalSavings">0 ETB</span></h3>
    </div>

    <!-- TABLE -->
    <table class="table">

      <thead>
        <tr>
          <th>Member</th>
          <th>Amount</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="savingsTable"></tbody>

    </table>

  </main>

  <script type="module" src="js/savings.js"></script>

</body>
</html>
