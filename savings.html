<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="savings">Savings</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

  <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
  <h2 class="logo">🏦 SACCO</h2>

  <nav class="nav">

    <a href="dashboard.html">📊 Dashboard</a>
    <a href="members.html">👥 Members</a>
    <a href="savings.html" class="active">💰 Savings</a>
    <a href="loans.html">🏦 Loans</a>
    <a href="repayments.html">💵 Repayments</a>
    <a href="withdrawals.html">💸 Withdrawals</a>
    <a href="reports.html">📄 Reports</a>
    <a href="users.html">👤 Users</a>
    <a href="settings.html">⚙️ Settings</a>

  </nav>

</aside>

<!-- MAIN -->
<main class="main">

  <div class="topbar">
    <h2>💰 Savings Module</h2>
    <div class="selected-box">👑 ADMIN</div>
  </div>

  <!-- DEPOSIT FORM -->
  <section class="card" style="margin-top:20px;">

    <h2>➕ Deposit Savings</h2>

    <input id="memberId" class="input" placeholder="Member ID">

    <input id="amount" type="number" class="input" placeholder="Amount">

    <button class="btn success" onclick="addSavings()">
      Save Deposit
    </button>

  </section>

  <!-- TABLE -->
  <section class="card" style="margin-top:20px;">

    <h2>📜 Savings History</h2>

    <table class="table">

      <thead>
        <tr>
          <th>Member ID</th>
          <th>Amount</th>
          <th>Date</th>
        </tr>
      </thead>

      <tbody id="savingsTable"></tbody>

    </table>

  </section>

</main>

<script src="js/layout.js"></script>
<script type="module" src="js/savings.js"></script>

</body>
</html>
