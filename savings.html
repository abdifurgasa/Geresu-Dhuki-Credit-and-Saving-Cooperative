<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Savings</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- =========================
     MAIN
========================= -->
<main class="main">

  <!-- TOPBAR -->
  <div class="topbar">

    <h2>💰 Savings Management</h2>

  </div>

  <!-- =========================
       MEMBER SELECT
  ========================= -->
  <div class="search-container">

    <input
      type="text"
      id="searchMember"
      class="input"
      placeholder="Search member (name, phone, NID)..."
      autocomplete="off"
    >

    <div id="searchResults"></div>

  </div>

  <!-- SELECTED MEMBER -->
  <div id="selectedBox" class="selected-box">
    👤 Select a member
  </div>

  <!-- =========================
       SAVINGS INPUT
  ========================= -->
  <div style="margin-top:20px;">

    <input
      type="number"
      id="amount"
      class="input"
      placeholder="Enter savings amount"
    >

    <button id="saveBtn" class="add-btn">
      💰 Deposit
    </button>

  </div>

  <hr style="margin:25px 0;">

  <!-- =========================
       HISTORY TABLE
  ========================= -->
  <h3>📜 Savings History</h3>

  <div class="table-card">

    <table class="table-modern">

      <thead>
        <tr>
          <th>Member</th>
          <th>Amount</th>
          <th>Date</th>
          <th>Created By</th>
        </tr>
      </thead>

      <tbody id="savingTable"></tbody>

    </table>

  </div>

</main>

<!-- =========================
     SCRIPT
========================= -->
<script type="module" src="js/savings.js"></script>

</body>
</html>
