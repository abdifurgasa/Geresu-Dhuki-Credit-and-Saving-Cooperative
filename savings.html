<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Savings System</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<aside class="sidebar" id="sidebar">
  <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
  <h2 class="logo">SACCO</h2>

  <nav class="nav">
    <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
    <a href="members.html" class="nav-item">👥 Members</a>
    <a href="savings.html" class="nav-item active">💰 Savings</a>
    <a href="loans.html" class="nav-item">🏦 Loans</a>
  </nav>
</aside>

<main class="main">

  <h2>Savings Management</h2>

  <!-- SEARCH -->
  <div class="search-container">

    <input type="text" id="searchMember" class="search-box"
           placeholder="Search Name / NID / Phone">

    <button class="search-btn" onclick="manualSearch()">🔍 Search</button>

  </div>

  <div id="searchResults" class="search-results"></div>

  <!-- SELECTED -->
  <div class="selected-box">
    <h3>Selected Member</h3>
    <p id="selectedMember">None</p>
  </div>

  <!-- DEPOSIT -->
  <div class="form-box">
    <input type="number" id="amount" placeholder="Enter Amount">
    <button class="add-btn" onclick="saveSaving()">Deposit</button>
  </div>

  <!-- HISTORY -->
  <h3>History</h3>
  <table class="table">
    <thead>
      <tr>
        <th>Member</th>
        <th>Amount</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="savingTable"></tbody>
  </table>

</main>

<script type="module" src="js/savings.js"></script>

</body>
</html>
