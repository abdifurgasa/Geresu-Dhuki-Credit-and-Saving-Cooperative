<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Savings Module</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
 <!-- TOGGLE -->
  <button class="toggle-btn"
          onclick="toggleSidebar()">

    ☰

  </button>

  <!-- LOGO -->
  <h2 class="logo">

    🏦 SACCO

  </h2>

  <!-- NAVIGATION -->
  <nav class="nav">

    <!-- DASHBOARD -->
    <a href="dashboard.html"
       class="nav-item active">

      <span class="icon">📊</span>

      <span class="text"
            data-i18n="dashboard">

        Dashboard

      </span>

    </a>

    <!-- MEMBERS -->
    <a href="members.html"
       class="nav-item admin-only">

      <span class="icon">👥</span>

      <span class="text"
            data-i18n="members">

        Members

      </span>

    </a>

    <!-- SAVINGS -->
    <a href="savings.html"
       class="nav-item">

      <span class="icon">💰</span>

      <span class="text"
            data-i18n="savings">

        Savings

      </span>

    </a>

    <!-- LOANS -->
    <a href="loans.html"
       class="nav-item">

      <span class="icon">🏦</span>

      <span class="text"
            data-i18n="loans">

        Loans

      </span>

    </a>

    <!-- REPAYMENTS -->
    <a href="repayments.html"
       class="nav-item">

      <span class="icon">💵</span>

      <span class="text"
            data-i18n="repayments">

        Repayments

      </span>

    </a>

    <!-- TRANSACTIONS -->
    <a href="transactions.html"
       class="nav-item admin-only">

      <span class="icon">💱</span>

      <span class="text"
            data-i18n="transactions">

        Transactions

      </span>

    </a>
    
<!-- WITHDRAWALS -->
    <a href="withdrawals.html"
       class="nav-item admin-only">

      <span class="icon">💵</span>

      <span class="text"
            data-i18n="withdrawals">

        Withdrawals

      </span>

    </a>
    <!-- REPORTS -->
    <a href="reports.html"
       class="nav-item admin-only">

      <span class="icon">📄</span>

      <span class="text"
            data-i18n="reports">

        Reports

      </span>

    </a>

    <!-- USERS -->
    <a href="users.html"
       class="nav-item admin-only">

      <span class="icon">👤</span>

      <span class="text"
            data-i18n="users">

        Users

      </span>

    </a>

    <!-- SETTINGS -->
    <a href="settings.html"
       class="nav-item">

      <span class="icon">⚙️</span>

      <span class="text"
            data-i18n="settings">

        Settings

      </span>

    </a>

  </nav>

</aside>

<div class="container">

  <h1>💰 SAVINGS SYSTEM</h1>

  <!-- =========================
       SEARCH MEMBER
  ========================= -->
  <div class="search-container">

    <input id="memberSearch"
           class="input"
           placeholder="Search by Name / Phone / NID">

    <button class="btn primary"
            onclick="searchMembers()">

      Search

    </button>

  </div>

  <!-- RESULTS -->
  <div id="searchResults"
       class="search-results"></div>

  <!-- SELECTED MEMBER -->
  <div id="selectedMember"
       class="selected-box">

    No member selected

  </div>

  <!-- =========================
       DEPOSIT
  ========================= -->
  <div class="form-box">

    <input id="amount"
           class="input"
           placeholder="Enter deposit amount">

    <button class="btn success"
            onclick="depositMoney()">

      Deposit

    </button>

  </div>

  <!-- =========================
       SAVINGS TABLE
  ========================= -->
  <table class="table">

    <thead>

      <tr>

        <th>Member</th>
        <th>Phone</th>
        <th>Amount</th>
        <th>Date</th>

      </tr>

    </thead>

    <tbody id="savingsTable">

    </tbody>

  </table>

</div>

<script type="module"src="js/savings.js"><script>
</script>

</body>
</html>
