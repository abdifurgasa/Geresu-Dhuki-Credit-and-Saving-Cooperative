<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Savings</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

  <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

  <h2 class="logo">SACCO</h2>

  <nav class="nav">
    <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
    <a href="members.html" class="nav-item">👥 Members</a>
    <a href="savings.html" class="nav-item active">💰 Savings</a>
    <a href="loans.html" class="nav-item">🏦 Loans</a>
    <a href="reports.html" class="nav-item">📄 Reports</a>
  </nav>

</aside>

<!-- MAIN -->
<main class="main">

  <h2>Savings Management</h2>

  <!-- MEMBER SEARCH -->
  <input type="text" id="searchMember" class="search-box"
         placeholder="Search by Name / NID / Phone">

  <!-- SEARCH RESULT -->
  <div id="searchResults" class="search-results"></div>

  <!-- SELECTED MEMBER -->
  <div class="selected-box">
    <h3>Selected Member</h3>
    <p id="selectedMember">None</p>
  </div>

  <!-- SAVING FORM -->
  <div class="form-box">

    <input type="number" id="amount" placeholder="Enter Amount">

    <button class="add-btn" onclick="saveSaving()">Deposit Savings</button>

  </div>

  <!-- HISTORY TABLE -->
  <h3>Saving History</h3>

  <table class="table">
    <thead>
      <tr>
        <th>Member</th>
        <th>Amount</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="savingTable"></tbody>
  </table>

</main>

<script type="module" src="js/savings.js"></script>

</body>
</html>
