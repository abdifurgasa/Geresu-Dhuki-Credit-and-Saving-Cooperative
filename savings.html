<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Savings Module</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

  <h1>💰 SAVINGS SYSTEM</h1>

  <!-- =========================
       SEARCH MEMBER
  ========================= -->
  <div class="search-container">

    <input id="memberSearch"
           class="input"
           placeholder="Search by Name / Phone / NID">

    <button class="btn primary"
            onclick="searchMembers()">

      Search

    </button>

  </div>

  <!-- RESULTS -->
  <div id="searchResults"
       class="search-results"></div>

  <!-- SELECTED MEMBER -->
  <div id="selectedMember"
       class="selected-box">

    No member selected

  </div>

  <!-- =========================
       DEPOSIT
  ========================= -->
  <div class="form-box">

    <input id="amount"
           class="input"
           placeholder="Enter deposit amount">

    <button class="btn success"
            onclick="depositMoney()">

      Deposit

    </button>

  </div>

  <!-- =========================
       SAVINGS TABLE
  ========================= -->
  <table class="table">

    <thead>

      <tr>

        <th>Member</th>
        <th>Phone</th>
        <th>Amount</th>
        <th>Date</th>

      </tr>

    </thead>

    <tbody id="savingsTable">

    </tbody>

  </table>

</div>

<script type="module"src="js/savings.js"><script>
</script>

</body>
</html>
