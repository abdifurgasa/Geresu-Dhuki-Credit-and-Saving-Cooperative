<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Members Management</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar">

  <h2 class="logo">🏦 SACCO</h2>

  <nav class="nav">

    <a href="dashboard.html" class="nav-item">
      📊 Dashboard
    </a>

    <a href="members.html" class="nav-item active">
      👥 Members
    </a>

    <a href="savings.html" class="nav-item">
      💰 Savings
    </a>

    <a href="loans.html" class="nav-item">
      🏦 Loans
    </a>

    <a href="withdrawals.html" class="nav-item">
      📤 Withdrawals
    </a>

    <a href="settings.html" class="nav-item">
      ⚙️ Settings
    </a>

  </nav>
</aside>

<!-- MAIN -->
<main class="main">

  <div class="topbar">
    <h2>Members Management</h2>

    <button class="add-btn" onclick="openModal()">
      + Add Member
    </button>
  </div>

  <!-- SEARCH -->
  <div class="search-container">
    <input id="searchInput" class="search-input" placeholder="Search members..."/>
  </div>

  <!-- TABLE -->
  <div class="table-card">

    <table class="table-modern">

      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>NID</th>
          <th>Savings</th>
          <th>Loans</th>
          <th>Status</th>
          <th>Created By</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="membersTable"></tbody>

    </table>

  </div>

  <!-- PAGINATION -->
  <div style="margin-top:20px; display:flex; gap:10px;">
    <button onclick="prevPage()">⬅ Prev</button>
    <button onclick="nextPage()">Next ➡</button>
  </div>

</main>

<!-- MODAL -->
<div id="memberModal" class="modal">
  <div class="modal-box">

    <h3>Add Member</h3>

    <form id="memberForm">

      <input id="name" placeholder="Name" required />
      <input id="phone" placeholder="Phone" required />
      <input id="nid" placeholder="NID" required />

      <button type="submit" class="save-btn">Save</button>
      <button type="button" class="close-btn" onclick="closeModal()">Close</button>

    </form>

  </div>
</div>

<script type="module" src="js/members.js"></script>

</body>
</html>
