<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members Management</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ================= SIDEBAR ================= -->
<aside class="sidebar" id="sidebar">

  <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

  <h2 class="logo">🏦 SACCO</h2>

  <nav class="nav">

    <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
    <a href="members.html" class="nav-item active">👥 Members</a>
    <a href="savings.html" class="nav-item">💰 Savings</a>
    <a href="loans.html" class="nav-item">🏦 Loans</a>
    <a href="repayments.html" class="nav-item">💵 Repayments</a>

  </nav>

</aside>

<!-- ================= MAIN ================= -->
<main class="main">

  <!-- TOP BAR -->
  <div class="topbar">

    <h2>👥 Members Management</h2>

    <div>
      <button id="btnOpenModal" class="btn add-btn">
        + Add Member
      </button>

      <input id="searchBox" class="input"
             placeholder="Search member...">
    </div>

  </div>

  <!-- ================= DASH CARDS ================= -->
  <section class="cards">

    <div class="card blue">
      <h3>Total Members</h3>
      <p id="memberCount">0</p>
    </div>

    <div class="card green">
      <h3>Active</h3>
      <p id="activeCount">0</p>
    </div>

    <div class="card purple">
      <h3>Verified</h3>
      <p id="verifiedCount">0</p>
    </div>

  </section>

  <!-- ================= TABLE ================= -->
  <div class="table-container">

    <table class="table">

      <thead>

        <tr>

          <th>Member</th>
          <th>Phone</th>
          <th>NID</th>

          <th>Savings</th>
          <th>Loans</th>
          <th>Repayment</th>
          <th>Remaining</th>

          <th>Status</th>
          <th>Actions</th>

        </tr>

      </thead>

      <tbody id="memberTable">

        <!-- JS LOAD HERE -->

      </tbody>

    </table>

  </div>

</main>

<!-- ================= MODAL ================= -->
<div id="modal" class="modal hidden">

  <div class="modal-box">

    <h2 id="modalTitle">Add Member</h2>

    <!-- PHOTO -->
    <img id="previewImage"
         src="https://via.placeholder.com/80"
         class="avatar">

    <input type="file" id="photo" class="input">

    <input id="name" class="input" placeholder="Full Name">
    <input id="phone" class="input" placeholder="Phone (9 digits)">
    <input id="nid" class="input" placeholder="NID (16 digits)">

    <div class="row">

      <button id="btnSave" class="btn add-btn">Save</button>
      <button id="btnClose" class="btn danger">Close</button>

    </div>

  </div>

</div>

<!-- ================= JS ================= -->
<script type="module" src="js/members.page.js"></script>

</body>
</html>
