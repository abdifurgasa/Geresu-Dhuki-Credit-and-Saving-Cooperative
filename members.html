<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>

    Members Module

  </title>

  <!-- CSS -->
  <link rel="stylesheet"
        href="css/style.css">

</head>

<body>

<!-- =========================
     SIDEBAR
========================= -->
<aside class="sidebar"
       id="sidebar">

  <!-- TOGGLE -->
  <button class="toggle-btn"
          onclick="toggleSidebar()">

    ☰

  </button>

  <!-- LOGO -->
  <h2 class="logo">

    🏦 SACCO

  </h2>

  <!-- NAVIGATION -->
  <nav class="nav">

    <a href="dashboard.html"
       class="nav-item">

      <span class="icon">📊</span>

      <span class="text">

        Dashboard

      </span>

    </a>

    <a href="members.html"
       class="nav-item active">

      <span class="icon">👥</span>

      <span class="text">

        Members

      </span>

    </a>

    <a href="savings.html"
       class="nav-item">

      <span class="icon">💰</span>

      <span class="text">

        Savings

      </span>

    </a>

    <a href="loans.html"
       class="nav-item">

      <span class="icon">🏦</span>

      <span class="text">

        Loans

      </span>

    </a>

    <a href="transactions.html"
       class="nav-item">

      <span class="icon">💱</span>

      <span class="text">

        Transactions

      </span>

    </a>

    <a href="reports.html"
       class="nav-item">

      <span class="icon">📄</span>

      <span class="text">

        Reports

      </span>

    </a>

    <a href="users.html"
       class="nav-item">

      <span class="icon">👤</span>

      <span class="text">

        Users

      </span>

    </a>

    <a href="settings.html"
       class="nav-item">

      <span class="icon">⚙️</span>

      <span class="text">

        Settings

      </span>

    </a>

  </nav>

</aside>

<!-- =========================
     MAIN CONTENT
========================= -->
<main class="main"
      id="main">

  <!-- =========================
       TOPBAR
  ========================= -->
  <div class="topbar">

    <!-- LEFT -->
    <div>

      <h2>

        Members management

      </h2>

    </div>

    <!-- RIGHT -->
    <div style="
      display:flex;
      align-items:center;
      gap:10px;
    ">

      <!-- ROLE -->
      <div class="selected-box"
           style="
             padding:10px 15px;
             margin:0;
           ">

        👑 Admin

      </div>

      <!-- LANGUAGE -->
      <select id="langSelect"
              class="lang-select"
              onchange="changeLang(this.value)">

        <option value="EN">

          EN

        </option>

        <option value="AM">

          AM

        </option>

        <option value="OR">

          OR

        </option>

      </select>

      <!-- LOGOUT -->
      <button class="btn logout-btn"
              onclick="logout()">

        Logout

      </button>

    </div>

  </div>

  <!-- =========================
       PAGE HEADER
  ========================= -->
  <div style="margin-top:25px;">

    <h1>

      👥 MEMBERS MANAGEMENT

    </h1>

  </div>

  <!-- =========================
       DASHBOARD CARDS
  ========================= -->
  <section class="cards">

    <!-- TOTAL -->
    <div class="card blue">

      <h3>

        Total Members

      </h3>

      <p id="memberCount">

        0

      </p>

    </div>

    <!-- ACTIVE -->
    <div class="card green">

      <h3>

        Active Members

      </h3>

      <p id="activeCount">

        0

      </p>

    </div>

    <!-- NEW -->
    <div class="card orange">

      <h3>

        New This Month

      </h3>

      <p id="newCount">

        0

      </p>

    </div>

    <!-- VERIFIED -->
    <div class="card purple">

      <h3>

        Verified IDs

      </h3>

      <p id="verifiedCount">

        0

      </p>

    </div>

  </section>

  <!-- =========================
       ACTION BAR
  ========================= -->
  <div class="topbar"
       style="margin-top:25px;">

    <!-- ADD -->
    <button class="btn add-btn"
            onclick="openModal()">

      + Add Member

    </button>

    <!-- SEARCH -->
    <input id="searchBox"
           class="input"
           placeholder="Search by Name / Phone / NID"
           style="
             width:300px;
             margin:0;
           ">

  </div>

  <!-- =========================
       TABLE
  ========================= -->
  <table class="table">

    <thead>

      <tr>

        <th>

          Full Name

        </th>

        <th>

          Phone

        </th>

        <th>

          National ID

        </th>

        <th>

          Status

        </th>

        <th>

          Actions

        </th>

      </tr>

    </thead>

    <tbody id="memberTable">

    </tbody>

  </table>

</main>

<!-- =========================
     MODAL
========================= -->
<div id="modal"
     class="modal">

  <div class="modal-box">

    <!-- TITLE -->
    <h2 id="formTitle">

      Add Member

    </h2>

    <!-- NAME -->
    <input id="name"
           class="input"
           placeholder="Full Name">

    <!-- PHONE -->
    <input id="phone"
           class="input"
           placeholder="Phone (9 digits)">

    <!-- NID -->
    <input id="nid"
           class="input"
           placeholder="National ID (16 digits)">

    <!-- BUTTONS -->
    <div style="
      display:flex;
      gap:10px;
      margin-top:15px;
    ">

      <!-- SAVE -->
      <button class="btn add-btn"
              style="flex:1;"
              onclick="saveMember()">

        Save

      </button>

      <!-- CANCEL -->
      <button class="btn danger"
              style="flex:1;"
              onclick="closeModal()">

        Cancel

      </button>

    </div>

  </div>

</div>

<!-- =========================
     JS FILES
========================= -->

<!-- I18N -->
<script src="js/i18n.js"></script>

<!-- MEMBERS -->
<script type="module"src="js/members.js">
</script>

</body>
</html>
