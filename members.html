<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACCO | Members Management</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="sidebar">
    <div class="logo">
        <h2><i class="fas fa-piggy-bank"></i> SACCO</h2>
        <p>Banking System</p>
    </div>
    <ul class="nav-menu">
        <li class="nav-item"><a href="index.html"><i class="fas fa-chart-line"></i> <span>Dashboard</span></a></li>
        <li class="nav-item active"><a href="members.html"><i class="fas fa-users"></i> <span>Members</span></a></li>
        <li class="nav-item"><a href="savings.html"><i class="fas fa-coins"></i> <span>Savings</span></a></li>
        <li class="nav-item"><a href="loans.html"><i class="fas fa-hand-holding-usd"></i> <span>Loans</span></a></li>
        <li class="nav-item"><a href="withdrawals.html"><i class="fas fa-money-bill-wave"></i> <span>Withdrawals</span></a></li>
        <li class="nav-item"><a href="reports.html"><i class="fas fa-file-alt"></i> <span>Reports</span></a></li>
        <li class="nav-item"><a href="users.html"><i class="fas fa-user-cog"></i> <span>Users</span></a></li>
        <li class="nav-item"><a href="settings.html"><i class="fas fa-cog"></i> <span>Settings</span></a></li>
    </ul>
</div>

<div class="main-content">
    <div class="header">
        <h1>Member Management</h1>
        <div class="user-info">
            <span>Welcome, Admin</span>
            <i class="fas fa-bell"></i>
            <i class="fas fa-user-circle fa-2x"></i>
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn-primary" onclick="openAddMemberModal()">
            <i class="fas fa-user-plus"></i> Add New Member
        </button>
    </div>

    <div class="data-table">
        <table id="membersTable">
            <thead>
                <tr>
                    <th>Member ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Join Date</th>
                    <th>Savings Balance</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="membersList">
                <tr><td colspan="7" class="loading">Loading members...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add Member Modal -->
<div id="memberModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('memberModal')">&times;</span>
        <h2>Add New Member</h2>
        <form id="memberForm">
            <input type="text" id="fullName" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="tel" id="phone" placeholder="Phone Number (e.g., 0912345678)" required>
            <textarea id="address" placeholder="Address" rows="3"></textarea>
            <button type="submit">Register Member</button>
        </form>
    </div>
</div>

<!-- Edit Member Modal -->
<div id="editMemberModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('editMemberModal')">&times;</span>
        <h2>Edit Member</h2>
        <form id="editMemberForm">
            <input type="hidden" id="editMemberId">
            <input type="text" id="editFullName" placeholder="Full Name" required>
            <input type="email" id="editEmail" placeholder="Email" required>
            <input type="tel" id="editPhone" placeholder="Phone Number" required>
            <textarea id="editAddress" placeholder="Address" rows="3"></textarea>
            <button type="submit">Update Member</button>
        </form>
    </div>
</div>

<script type="module">
    import { db, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, Timestamp } from './js/firebase.js';
    import { formatCurrency, formatDate, showError, showSuccess, closeModal, openModal, setupModalHandlers, isValidEmail, isValidPhone } from './js/utils.js';
    
    let currentEditId = null;
    
    // Load members
    async function loadMembers() {
        const membersList = document.getElementById('membersList');
        membersList.innerHTML = '<tr><td colspan="7" class="loading">Loading...</td></tr>';
        
        try {
            const querySnapshot = await getDocs(collection(db, "members"));
            membersList.innerHTML = '';
            
            if (querySnapshot.empty) {
                membersList.innerHTML = '<tr><td colspan="7">No members found. Add your first member!</td></tr>';
                return;
            }
            
            querySnapshot.forEach((doc) => {
                const member = doc.data();
                const row = `
                    <tr>
                        <td>${doc.id.slice(0, 8)}</td>
                        <td>${member.fullName || ''}</td>
                        <td>${member.email || ''}</td>
                        <td>${member.phone || ''}</td>
                        <td>${formatDate(member.joinDate)}</td>
                        <td>${formatCurrency(member.savingsBalance || 0)}</td>
                        <td>
                            <button class="btn-edit" onclick='editMember("${doc.id}", ${JSON.stringify(member).replace(/'/g, "&#39;")})'>Edit</button>
                            <button class="btn-danger" onclick='deleteMember("${doc.id}")'>Delete</button>
                        </td>
                    </tr>
                `;
                membersList.innerHTML += row;
            });
        } catch (error) {
            console.error("Error loading members:", error);
            showError('Failed to load members');
            membersList.innerHTML = '<tr><td colspan="7">Error loading members. Check console.</td></tr>';
        }
    }
    
    // Add member
    document.getElementById('memberForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        
        if (!isValidEmail(email)) {
            showError('Please enter a valid email address');
            return;
        }
        
        if (!isValidPhone(phone)) {
            showError('Please enter a valid Ethiopian phone number (e.g., 0912345678)');
            return;
        }
        
        const memberData = {
            fullName: document.getElementById('fullName').value,
            email: email,
            phone: phone,
            address: document.getElementById('address').value,
            joinDate: Timestamp.now(),
            savingsBalance: 0,
            active: true,
            createdAt: Timestamp.now()
        };
        
        try {
            await addDoc(collection(db, "members"), memberData);
            showSuccess('Member added successfully!');
            closeModal('memberModal');
            document.getElementById('memberForm').reset();
            loadMembers();
        } catch (error) {
            console.error("Error adding member:", error);
            showError('Error adding member: ' + error.message);
        }
    });
    
    // Edit member
    window.editMember = (id, member) => {
        currentEditId = id;
        document.getElementById('editFullName').value = member.fullName;
        document.getElementById('editEmail').value = member.email;
        document.getElementById('editPhone').value = member.phone;
        document.getElementById('editAddress').value = member.address || '';
        openModal('editMemberModal');
    };
    
    // Update member
    document.getElementById('editMemberForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const memberRef = doc(db, "members", currentEditId);
        const updatedData = {
            fullName: document.getElementById('editFullName').value,
            email: document.getElementById('editEmail').value,
            phone: document.getElementById('editPhone').value,
            address: document.getElementById('editAddress').value,
            updatedAt: Timestamp.now()
        };
        
        try {
            await updateDoc(memberRef, updatedData);
            showSuccess('Member updated successfully!');
            closeModal('editMemberModal');
            loadMembers();
        } catch (error) {
            console.error("Error updating member:", error);
            showError('Error updating member: ' + error.message);
        }
    });
    
    // Delete member
    window.deleteMember = async (id) => {
        if (confirm('Are you sure you want to delete this member? This action cannot be undone.')) {
            try {
                await deleteDoc(doc(db, "members", id));
                showSuccess('Member deleted successfully!');
                loadMembers();
            } catch (error) {
                console.error("Error deleting member:", error);
                showError('Error deleting member: ' + error.message);
            }
        }
    };
    
    window.openAddMemberModal = () => {
        openModal('memberModal');
    };
    
    // Make closeModal available globally
    window.closeModal = closeModal;
    
    // Setup modal handlers
    setupModalHandlers();
    
    // Initial load
    loadMembers();
</script>

</body>
</html>
