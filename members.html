<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members Management</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

  <h2 class="logo">🏦 SACCO</h2>

  <nav class="nav">
    <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
    <a href="members.html" class="nav-item active">👥 Members</a>
    <a href="savings.html" class="nav-item">💰 Savings</a>
    <a href="loans.html" class="nav-item">🏦 Loans</a>
  </nav>
</aside>

<!-- MAIN -->
<main class="main">

  <h1>👥 MEMBERS MANAGEMENT</h1>

  <!-- CARDS -->
  <section class="cards">
    <div class="card blue"><h3>Total</h3><p id="memberCount">0</p></div>
    <div class="card green"><h3>Active</h3><p id="activeCount">0</p></div>
    <div class="card orange"><h3>New</h3><p id="newCount">0</p></div>
    <div class="card purple"><h3>Verified</h3><p id="verifiedCount">0</p></div>
  </section>

  <!-- ACTIONS -->
  <div style="margin-top:20px; display:flex; gap:10px;">
    <button class="btn add-btn" onclick="openModal()">+ Add Member</button>
    <input id="searchBox" class="input" placeholder="Search member...">
  </div>

  <!-- TABLE -->
  <div style="overflow-x:auto; margin-top:20px;">
    <table class="table">
      <thead>
        <tr>
          <th>Member</th>
          <th>Phone</th>
          <th>NID</th>
          <th>Savings</th>
          <th>Loans</th>
          <th>Remaining</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="memberTable"></tbody>
    </table>
  </div>

</main>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">

    <h2 id="formTitle">Add Member</h2>

    <input id="name" class="input" placeholder="Full Name">
    <input id="phone" class="input" placeholder="Phone (9 digits)">
    <input id="nid" class="input" placeholder="NID (16 digits)">

    <input type="file" id="photo" class="input">

    <div style="display:flex; gap:10px; margin-top:15px;">
      <button class="btn add-btn" onclick="saveMember()">Save</button>
      <button class="btn danger" onclick="closeModal()">Cancel</button>
    </div>

  </div>
</div>

<script type="module" src="js/members.js"></script>

</body>
</html>
