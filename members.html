<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Members</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main>

  <h1>Members Management</h1>

  <!-- ACTIONS -->
  <div class="topbar">

    <button id="btnOpenModal" class="btn add-btn">
      + Add Member
    </button>

    <input id="searchBox" class="input"
           placeholder="Search members...">

  </div>

  <!-- CARDS -->
  <section class="cards">

    <div class="card blue">
      <h3>Total</h3>
      <p id="memberCount">0</p>
    </div>

    <div class="card green">
      <h3>Active</h3>
      <p id="activeCount">0</p>
    </div>

    <div class="card purple">
      <h3>Verified</h3>
      <p id="verifiedCount">0</p>
    </div>

  </section>

  <!-- TABLE -->
  <table class="table">

    <thead>
      <tr>
        <th>Member</th>
        <th>Phone</th>
        <th>NID</th>
        <th>Savings</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody id="memberTable"></tbody>

  </table>

</main>

<!-- MODAL -->
<div id="modal" class="modal hidden">

  <div class="modal-box">

    <h2 id="modalTitle">Add Member</h2>

    <input id="name" class="input" placeholder="Name">
    <input id="phone" class="input" placeholder="Phone (9 digits)">
    <input id="nid" class="input" placeholder="NID (16 digits)">

    <input type="file" id="photo" class="input">

    <div class="row">

      <button id="btnSave" class="btn add-btn">Save</button>
      <button id="btnClose" class="btn danger">Close</button>

    </div>

  </div>

</div>

<script type="module" src="js/members.page.js"></script>

</body>
</html>
