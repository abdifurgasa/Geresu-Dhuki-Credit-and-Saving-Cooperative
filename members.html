<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Members</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="main">

  <!-- TOP -->
  <div class="topbar">
    <h2>👥 Members Management</h2>

    <button class="add-btn" onclick="openModal()">
      + Add Member
    </button>
  </div>

  <!-- SEARCH -->
  <div class="search-container">

    <input
      type="text"
      id="searchMember"
      class="input"
      placeholder="Search by name, phone, NID..."
    >

    <div id="searchResults" class="search-results"></div>

  </div>

  <!-- SELECTED MEMBER -->
  <div id="selectedMember" class="selected-box">
    👤 Select a member
  </div>

  <!-- TABLE -->
  <div class="table-card">

    <table class="table-modern">

      <thead>
        <tr>
          <th>Photo</th>
          <th>Name</th>
          <th>Phone</th>
          <th>NID</th>
          <th>Savings</th>
          <th>Loan</th>
          <th>Remaining</th>
          <th>Status</th>
          <th>Created</th>
          <th>By</th>
        </tr>
      </thead>

      <tbody id="membersTable"></tbody>

    </table>

  </div>

</main>

<!-- MODAL -->
<div class="modal" id="memberModal">

  <div class="modal-box">

    <h3>Add Member</h3>

    <form id="memberForm">

      <input type="text" id="name" placeholder="Full Name" required>

      <input
        type="text"
        id="phone"
        placeholder="Phone (9 digits)"
        maxlength="9"
        oninput="this.value=this.value.replace(/[^0-9]/g,'')"
        required
      >

      <input
        type="text"
        id="nid"
        placeholder="NID (16 digits)"
        maxlength="16"
        oninput="this.value=this.value.replace(/[^0-9]/g,'')"
        required
      >

      <input type="file" id="photo" required>

      <button type="submit" class="save-btn">Save</button>
      <button type="button" class="close-btn" onclick="closeModal()">Cancel</button>

    </form>

  </div>

</div>

<script type="module" src="js/members.js"></script>

<script>
function openModal(){
  document.getElementById("memberModal").style.display="flex";
}
function closeModal(){
  document.getElementById("memberModal").style.display="none";
}
</script>

</body>
</html>
