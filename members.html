<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members Management</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="container">

    <h2>👥 Members Management</h2>

    <!-- BUTTON -->
    <button onclick="openModal()">+ Add Member</button>

    <!-- TABLE -->
    <table border="1" width="100%" style="margin-top:20px;">
      <thead>
        <tr>
          <th>Photo</th>
          <th>Name</th>
          <th>Phone</th>
          <th>NID</th>
          <th>Savings</th>
          <th>Loan</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="membersTable"></tbody>
    </table>

  </div>

  <!-- ================= MODAL ================= -->
  <div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000000aa;">

    <div style="background:white; width:400px; margin:10% auto; padding:20px;">

      <h3>Add Member</h3>

      <form id="memberForm">

        <input type="text" id="name" placeholder="Name" required><br><br>
        <input type="text" id="phone" placeholder="Phone" required><br><br>
        <input type="text" id="nid" placeholder="NID" required><br><br>
        <input type="file" id="photo" required><br><br>

        <button type="submit">Save</button>
        <button type="button" onclick="closeModal()">Close</button>

      </form>

    </div>

  </div>

  <script type="module" src="js/members.js"></script>

  <script>
    function openModal() {
      document.getElementById("modal").style.display = "block";
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }
  </script>

</body>
</html>
