<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- SIDEBAR LOADS FROM layout.js -->
<div class="overlay"></div>

<main class="main">

  <div class="topbar">
    <h2>👥 Members Management</h2>
  </div>

  <!-- CARDS -->
  <section class="cards">

    <div class="card blue">
      <h3>Total Members</h3>
      <p id="memberCount">0</p>
    </div>

    <div class="card green">
      <h3>Active Members</h3>
      <p id="activeCount">0</p>
    </div>

  </section>

  <!-- ADD MEMBER BUTTON -->
  <button class="btn success" onclick="openModal()">
    + Add Member
  </button>

  <!-- TABLE -->
  <div style="overflow-x:auto; margin-top:20px;">
    <table class="table">

      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>NID</th>
          <th>Savings</th>
          <th>Loans</th>
          <th>Status</th>
          <th>Action By</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="memberTable"></tbody>

    </table>
  </div>

</main>

<!-- MODAL -->
<div id="modal" class="modal">

  <div class="modal-box">

    <h2 id="formTitle">Add Member</h2>

    <input id="name" class="input" placeholder="Full Name">
    <input id="phone" class="input" placeholder="Phone (9 digits)">
    <input id="nid" class="input" placeholder="NID (16 digits)">

    <button class="btn success" onclick="saveMember()">
      Save Member
    </button>

    <button class="btn danger" onclick="closeModal()">
      Cancel
    </button>

  </div>

</div>

<!-- SCRIPTS -->
<script src="js/layout.js"></script>
<script type="module" src="js/members.js"></script>

</body>
</html>
