<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Members Management</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

<!-- =========================================================
     SIDEBAR (FULL MENU)
========================================================= -->
<aside class="sidebar">

  <h2 class="logo">🏦 SACCO</h2>

  <nav class="nav">

    <a href="dashboard.html" class="nav-item">
      📊 <span class="text">Dashboard</span>
    </a>

    <a href="members.html" class="nav-item active">
      👥 <span class="text">Members</span>
    </a>

    <a href="savings.html" class="nav-item">
      💰 <span class="text">Savings</span>
    </a>

    <a href="loans.html" class="nav-item">
      🏦 <span class="text">Loans</span>
    </a>

    <a href="repayments.html" class="nav-item">
      💳 <span class="text">Repayments</span>
    </a>

    <a href="withdrawals.html" class="nav-item">
      📤 <span class="text">Withdrawals</span>
    </a>

    <a href="reports.html" class="nav-item">
      📈 <span class="text">Reports</span>
    </a>

    <a href="users.html" class="nav-item">
      👨‍💼 <span class="text">Users</span>
    </a>

    <a href="settings.html" class="nav-item">
      ⚙️ <span class="text">Settings</span>
    </a>

    <a href="#" class="nav-item logout">
      🚪 <span class="text">Logout</span>
    </a>

  </nav>

</aside>

<!-- =========================================================
     MAIN CONTENT
========================================================= -->
<main class="main">

  <!-- TOPBAR -->
  <div class="topbar">

    <h2>👥 Members Management</h2>

    <button class="add-btn" onclick="openModal()">
      + Add Member
    </button>

  </div>

  <!-- SEARCH -->
  <div class="search-container">

    <input
      type="text"
      id="searchMember"
      class="search-input"
      placeholder="Search member (name, phone, NID)"
    />

    <div id="searchResults"></div>

  </div>

  <!-- SELECTED MEMBER -->
  <div id="selectedMember" class="card card-soft-blue">
    👤 Select a member to view details
  </div>

  <!-- TABLE -->
  <div class="table-card" style="margin-top:20px;">

    <table class="table-modern">

      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>NID</th>
          <th>Savings</th>
          <th>Loans</th>
          <th>Status</th>
          <th>Created By</th>
          <th>Date</th>
        </tr>
      </thead>

      <tbody id="membersTable"></tbody>

    </table>

  </div>

</main>

<!-- =========================================================
     ADD MEMBER MODAL (NO PHOTO)
========================================================= -->
<div class="modal" id="memberModal">

  <div class="modal-box">

    <h2>Add Member</h2>

    <form id="memberForm">

      <input
        type="text"
        id="name"
        class="search-input"
        placeholder="Full Name"
        required
      />

      <br><br>

      <input
        type="text"
        id="phone"
        class="search-input"
        placeholder="Phone"
        required
      />

      <br><br>

      <input
        type="text"
        id="nid"
        class="search-input"
        placeholder="National ID"
        required
      />

      <br><br>

      <button type="submit" class="save-btn">
        Save Member
      </button>

      <button type="button" class="close-btn" onclick="closeModal()">
        Close
      </button>

    </form>

  </div>

</div>

<!-- =========================================================
     SCRIPT
========================================================= -->
<script type="module" src="js/members.js"></script>

<script>
function openModal() {
  document.getElementById("memberModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("memberModal").style.display = "none";
}
</script>

</body>
</html>
