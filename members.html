<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Members</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

  <h1>👥 SACCO Members</h1>

  <button class="btn primary" onclick="openModal()">+ Add Member</button>

  <input id="searchBox" class="input"
         placeholder="Search by Name / Phone / NID">

  <table class="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>NID</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody id="memberTable"></tbody>
  </table>

</div>

<!-- MODAL -->
<div id="modal" class="modal">

  <div class="modal-box">

    <h2 id="title">Add Member</h2>

    <input id="name" class="input" placeholder="Full Name">
    <input id="phone" class="input" placeholder="Phone (9 digits)">
    <input id="nid" class="input" placeholder="National ID (16 digits)">

    <button class="btn success" onclick="saveMember()">Save</button>
    <button class="btn danger" onclick="closeModal()">Cancel</button>

  </div>

</div>

<script type="module" src="js/members.js"></script>

</body>
</html>
