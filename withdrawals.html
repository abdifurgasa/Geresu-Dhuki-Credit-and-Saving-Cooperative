<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title data-i18n="withdrawalsModule">Withdrawals Module</title>

  <link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

  <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

  <h2 class="logo">🏦 SACCO</h2>

  <nav class="nav">

    <a href="dashboard.html" class="nav-item">
      <span class="icon">📊</span>
      <span class="text" data-i18n="dashboard">Dashboard</span>
    </a>

    <a href="members.html" class="nav-item">
      <span class="icon">👥</span>
      <span class="text" data-i18n="members">Members</span>
    </a>

    <a href="savings.html" class="nav-item">
      <span class="icon">💰</span>
      <span class="text" data-i18n="savings">Savings</span>
    </a>

    <a href="loans.html" class="nav-item">
      <span class="icon">🏦</span>
      <span class="text" data-i18n="loans">Loans</span>
    </a>

    <a href="repayments.html" class="nav-item">
      <span class="icon">💵</span>
      <span class="text" data-i18n="repayments">Repayments</span>
    </a>

    <a href="withdrawals.html" class="nav-item active">
      <span class="icon">💸</span>
      <span class="text" data-i18n="withdrawals">Withdrawals</span>
    </a>

  </nav>

</aside>

<!-- MAIN -->
<main class="main" id="main">

  <!-- TOPBAR -->
  <div class="topbar">

    <h2 data-i18n="withdrawalsManagement">Withdrawals Management</h2>

    <div style="display:flex; gap:10px; align-items:center;">

      <!-- LANGUAGE -->
      <select id="langSelect" class="lang-select" onchange="changeLang(this.value)">

        <option value="EN">EN</option>
        <option value="AM">AM</option>
        <option value="OR">OR</option>

      </select>

      <div class="selected-box">👑 ADMIN</div>

    </div>

  </div>

  <!-- HEADER -->
  <div style="margin-top:25px;">
    <h1 data-i18n="withdrawalModule">WITHDRAWAL MODULE</h1>
    <p data-i18n="manageWithdrawals">Manage SACCO withdrawal expenses</p>
  </div>

  <!-- CARDS -->
  <section class="cards">

    <div class="card red">
      <h3 data-i18n="totalWithdrawals">Total Withdrawals</h3>
      <p id="totalWithdrawals">0 ETB</p>
    </div>

    <div class="card blue">
      <h3 data-i18n="totalRecords">Total Records</h3>
      <p id="withdrawCount">0</p>
    </div>

  </section>

  <!-- FORM -->
  <section style="margin-top:30px;">

    <div class="card">

      <h2 data-i18n="newWithdrawal">💸 New Withdrawal</h2>

      <input id="withdrawer" class="input" type="text" data-i18n-placeholder="withdrawerName">

      <input id="withdrawAmount" class="input" type="number" data-i18n-placeholder="withdrawAmount">

      <textarea id="withdrawReason" class="input" data-i18n-placeholder="withdrawReason"
        style="min-height:120px;"></textarea>

      <button class="btn danger" onclick="makeWithdrawal()" data-i18n="withdrawNow">
        Withdraw Now
      </button>

    </div>

  </section>

  <!-- TABLE -->
  <section style="margin-top:30px;">

    <div class="card">

      <h2 data-i18n="withdrawalHistory">Withdrawal History</h2>

      <div style="overflow-x:auto;">

        <table class="table">

          <thead>

            <tr>
              <th data-i18n="withdrawer">Withdrawer</th>
              <th data-i18n="amount">Amount</th>
              <th data-i18n="reason">Reason</th>
              <th data-i18n="actionBy">Action By</th>
              <th data-i18n="date">Date</th>
            </tr>

          </thead>

          <tbody id="withdrawTable"></tbody>

        </table>

      </div>

    </div>

  </section>

</main>

<!-- SIDEBAR -->
<script>
function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("collapsed");
}
</script>

<!-- I18N SYSTEM -->
<script src="js/i18n.js"></script>

<!-- JS -->
<script type="module" src="js/withdrawals.js"></script>

</body>
</html>
