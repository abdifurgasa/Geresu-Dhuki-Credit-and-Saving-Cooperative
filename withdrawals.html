<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACCO | Withdrawals Management</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="sidebar">
    <div class="logo">
        <h2><i class="fas fa-piggy-bank"></i> SACCO</h2>
        <p>Banking System</p>
    </div>
    <ul class="nav-menu">
        <li class="nav-item"><a href="index.html"><i class="fas fa-chart-line"></i> <span>Dashboard</span></a></li>
        <li class="nav-item"><a href="members.html"><i class="fas fa-users"></i> <span>Members</span></a></li>
        <li class="nav-item"><a href="savings.html"><i class="fas fa-coins"></i> <span>Savings</span></a></li>
        <li class="nav-item"><a href="loans.html"><i class="fas fa-hand-holding-usd"></i> <span>Loans</span></a></li>
        <li class="nav-item active"><a href="withdrawals.html"><i class="fas fa-money-bill-wave"></i> <span>Withdrawals</span></a></li>
        <li class="nav-item"><a href="reports.html"><i class="fas fa-file-alt"></i> <span>Reports</span></a></li>
        <li class="nav-item"><a href="users.html"><i class="fas fa-user-cog"></i> <span>Users</span></a></li>
        <li class="nav-item"><a href="settings.html"><i class="fas fa-cog"></i> <span>Settings</span></a></li>
    </ul>
</div>

<div class="main-content">
    <div class="header">
        <h1>Withdrawals Management</h1>
        <div class="user-info">
            <span>Welcome, Admin</span>
            <i class="fas fa-bell"></i>
            <i class="fas fa-user-circle fa-2x"></i>
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn-primary" onclick="openWithdrawalModal()">
            <i class="fas fa-money-bill-wave"></i> Process Withdrawal
        </button>
    </div>

    <div class="data-table">
        <table>
            <thead>
                <tr>
                    <th>Transaction ID</th>
                    <th>Member Name</th>
                    <th>Amount (ETB)</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="withdrawalsList">
                <tr><td colspan="5" class="loading">Loading withdrawal records...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Process Withdrawal Modal -->
<div id="withdrawalModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('withdrawalModal')">&times;</span>
        <h2>Process Withdrawal</h2>
        <form id="withdrawalForm">
            <select id="memberId" required>
                <option value="">Select Member</option>
            </select>
            <input type="number" id="withdrawalAmount" placeholder="Amount (ETB)" required>
            <input type="text" id="currentBalance" placeholder="Current Balance" readonly>
            <button type="submit">Process Withdrawal</button>
        </form>
    </div>
</div>

<script type="module">
    import { db, collection, getDocs, addDoc, updateDoc, doc, Timestamp } from './js/firebase.js';
    import { formatCurrency, formatDate, showError, showSuccess, closeModal, openModal, setupModalHandlers, getCurrentMonthYear } from './js/utils.js';
    
    let selectedMemberBalance = 0;
    let selectedMemberId = null;
    
    // Load members for dropdown
    async function loadMembersForDropdown() {
        try {
            const querySnapshot = await getDocs(collection(db, "members"));
            const select = document.getElementById('memberId');
            select.innerHTML = '<option value="">Select Member</option>';
            
            querySnapshot.forEach((doc) => {
                const member = doc.data();
                const option = document.createElement('option');
                option.value = doc.id;
                option.setAttribute('data-balance', member.savingsBalance || 0);
                option.textContent = `${member.fullName} - ${member.email} (Balance: ${formatCurrency(member.savingsBalance || 0)})`;
                select.appendChild(option);
            });
            
            // Add event listener to show balance
            select.addEventListener('change', (e) => {
                const selectedOption = e.target.options[e.target.selectedIndex];
                const balance = selectedOption.getAttribute('data-balance');
                selectedMemberId = e.target.value;
                selectedMemberBalance = parseFloat(balance) || 0;
                document.getElementById('currentBalance').value = formatCurrency(selectedMemberBalance);
            });
        } catch (error) {
            console.error("Error loading members:", error);
        }
    }
    
    // Load withdrawal records
    async function loadWithdrawals() {
        const withdrawalsList = document.getElementById('withdrawalsList');
        withdrawalsList.innerHTML = '<tr><td colspan="5" class="loading">Loading...</td></tr>';
        
        try {
            const querySnapshot = await getDocs(collection(db, "withdrawals"));
            withdrawalsList.innerHTML = '';
            
            if (querySnapshot.empty) {
                withdrawalsList.innerHTML = '<tr><td colspan="5">No withdrawal records found.</td></tr>';
                return;
            }
            
            for (const docSnap of querySnapshot.docs) {
                const withdrawal = docSnap.data();
                // Get member name
                const memberDoc = await getDocs(collection(db, "members"));
                let memberName = 'Unknown';
                for (const member of memberDoc.docs) {
                    if (member.id === withdrawal.memberId) {
                        memberName = member.data().fullName;
                        break;
                    }
                }
                
                const row = `
                    <tr>
                        <td>${docSnap.id.slice(0, 8)}</td>
                        <td>${memberName}</td>
                        <td>${formatCurrency(withdrawal.amount)}</td>
                        <td>${formatDate(withdrawal.date)}</td>
                        <td>${withdrawal.status || 'completed'}</td>
                    </tr>
                `;
                withdrawalsList.innerHTML += row;
            }
        } catch (error) {
            console.error("Error loading withdrawals:", error);
            showError('Failed to load withdrawal records');
        }
    }
    
    // Process withdrawal
    document.getElementById('withdrawalForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const memberId = document.getElementById('memberId').value;
        const amount = parseFloat(document.getElementById('withdrawalAmount').value);
        const { month, year } = getCurrentMonthYear();
        
        if (!memberId) {
            showError('Please select a member');
            return;
        }
        
        if (amount <= 0) {
            showError('Please enter a valid amount');
            return;
        }
        
        if (amount > selectedMemberBalance) {
            showError('Insufficient balance!');
            return;
        }
        
        try {
            // Record withdrawal transaction
            await addDoc(collection(db, "withdrawals"), {
                memberId: memberId,
                amount: amount,
                date: Timestamp.now(),
                status: 'completed',
                month: month,
                year: year,
                createdAt: Timestamp.now()
            });
            
            // Update member's savings balance
            const memberRef = doc(db, "members", memberId);
            await updateDoc(memberRef, { savingsBalance: selectedMemberBalance - amount });
            
            showSuccess(`Withdrawal of ${formatCurrency(amount)} processed successfully!`);
            closeModal('withdrawalModal');
            document.getElementById('withdrawalForm').reset();
            document.getElementById('currentBalance').value = '';
            loadWithdrawals();
            loadMembersForDropdown(); // Refresh dropdown balances
        } catch (error) {
            console.error("Error processing withdrawal:", error);
            showError('Error processing withdrawal: ' + error.message);
        }
    });
    
    window.openWithdrawalModal = () => {
        openModal('withdrawalModal');
        loadMembersForDropdown();
    };
    
    window.closeModal = closeModal;
    setupModalHandlers();
    
    // Initial load
    loadWithdrawals();
</script>

</body>
</html>
