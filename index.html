<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SACCO Login</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Segoe UI;
  background:linear-gradient(135deg,#4e73df,#1cc88a);
}

.box{
  width:350px;
  background:#fff;
  padding:30px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
  text-align:center;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

button{
  width:100%;
  padding:10px;
  background:#4e73df;
  border:none;
  color:#fff;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
}

button:hover{
  background:#2e59d9;
}

.msg{
  text-align:center;
  margin-top:10px;
  font-size:13px;
  color:red;
}
</style>

</head>

<body>

<div class="box">

  <h2>SACCO Login</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()" type="button">Login</button>

  <div class="msg" id="msg"></div>

</div>

<!-- FIREBASE -->
<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/login.js"></script>

</body>
</html>
