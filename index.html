<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title data-i18n="dashboard">SACCO Login</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* =========================
       BACKGROUND
    ========================= */
    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: url("assets/images/background.jpg") no-repeat center center/cover;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* DARK OVERLAY */
    body::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 0;
    }

    /* =========================
       FLOATING ANIMATION LAYER
    ========================= */
    .bg-animation {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .bg-animation span {
      position: absolute;
      display: block;
      width: 20px;
      height: 20px;
      background: rgba(255,255,255,0.08);
      animation: float 20s linear infinite;
      bottom: -150px;
      border-radius: 50%;
    }

    .bg-animation span:nth-child(1) { left: 10%; width: 40px; height: 40px; animation-delay: 0s; }
    .bg-animation span:nth-child(2) { left: 20%; animation-delay: 2s; }
    .bg-animation span:nth-child(3) { left: 35%; width: 60px; height: 60px; animation-delay: 4s; }
    .bg-animation span:nth-child(4) { left: 50%; animation-delay: 0s; }
    .bg-animation span:nth-child(5) { left: 70%; animation-delay: 3s; }
    .bg-animation span:nth-child(6) { left: 85%; width: 30px; height: 30px; animation-delay: 5s; }

    @keyframes float {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-1000px) scale(1.5); opacity: 0; }
    }

    /* =========================
       LOGIN CARD (GLASS STYLE)
    ========================= */
    .login-box {
      position: relative;
      z-index: 2;
      width: 360px;
      padding: 30px;
      border-radius: 16px;

      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);

      text-align: center;

      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* TITLE */
    .login-box h2 {
      color: white;
      margin-bottom: 10px;
    }

    .login-box p {
      color: #ddd;
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* INPUTS */
    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      outline: none;
    }

    /* BUTTON */
    .login-btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #0f172a;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn:hover {
      background: #1e293b;
      transform: scale(1.03);
    }

    /* LANGUAGE */
    .lang {
      margin-top: 15px;
      color: white;
      font-size: 13px;
    }

    .lang button {
      margin: 3px;
      padding: 5px 10px;
      border: 1px solid white;
      background: transparent;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    .lang button:hover {
      background: white;
      color: black;
    }
  </style>
</head>

<body>

  <!-- FLOATING BACKGROUND ELEMENTS -->
  <div class="bg-animation">
    <span></span><span></span><span></span>
    <span></span><span></span><span></span>
  </div>

  <!-- LOGIN BOX -->
  <div class="login-box">

    <h2 data-i18n="dashboard">SACCO LOGIN</h2>

    <p data-i18n="welcome">Welcome back</p>

    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">

    <button class="login-btn">Login</button>

    <!-- LANGUAGE SWITCH -->
    <div class="lang">
      <button onclick="changeLang('EN')">EN</button>
      <button onclick="changeLang('AM')">AM</button>
      <button onclick="changeLang('OR')">OR</button>

      <div>Lang: <span id="langText">EN</span></div>
    </div>

  </div>

  <!-- I18N SYSTEM -->
  <script src="js/i18n.js"></script>

</body>
</html>
