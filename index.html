<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SACCO Login</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f1f5f9;
}

/* TOP NAV */
.nav{
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 20px;
}

.nav .logo{
  font-weight:bold;
}

.nav select{
  padding:5px;
  border-radius:6px;
}

/* LOGIN CENTER */
.container{
  height:calc(100vh - 60px);
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  background:white;
  padding:30px;
  border-radius:12px;
  width:320px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.card h2{
  margin-bottom:20px;
}

input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border:1px solid #ddd;
  border-radius:6px;
}

button{
  width:100%;
  padding:10px;
  background:#3b82f6;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#2563eb;
}
</style>
</head>

<body>

<!-- TOP NAV -->
<div class="nav">
  <div class="logo">🏦 SACCO SYSTEM</div>

  <div>
    <select id="langSelect">
      <option value="en">EN</option>
      <option value="am">AM</option>
      <option value="om">OR</option>
    </select>
  </div>
</div>

<!-- LOGIN -->
<div class="container">
  <div class="card">

    <h2 data-i18n="login">Login</h2>

    <input id="email" placeholder="Email" data-i18n-placeholder="email">
    <input id="password" type="password" placeholder="Password" data-i18n-placeholder="password">

    <button id="loginBtn" data-i18n="login">Login</button>

  </div>
</div>

<!-- SCRIPTS -->
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/i18n-init.js"></script>

</body>
</html>
