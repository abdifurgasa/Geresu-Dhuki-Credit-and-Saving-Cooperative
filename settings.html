<head>

  <title>Settings</title>

<body>
 <!-- TOGGLE -->

  <!-- NAVIGATION -->

      <span class="icon">📊</span>

      <span class="text"
            data-i18n="dashboard">

        Dashboard

      </span>

    </a>

    <!-- MEMBERS -->
    <a href="members.html"
       class="nav-item admin-only">

      <span class="icon">👥</span>

      <span class="text"
            data-i18n="members">

        Members

      </span>

    </a>

    <!-- SAVINGS -->
    <a href="savings.html"
       class="nav-item">

      <span class="icon">💰</span>

      <span class="text"
            data-i18n="savings">

        Savings

      </span>

    </a>

    <!-- LOANS -->
    <a href="loans.html"
       class="nav-item">

      <span class="icon">🏦</span>

      <span class="text"
            data-i18n="loans">

        Loans

      </span>

    </a>

    <!-- REPAYMENTS -->
    <a href="repayments.html"
       class="nav-item">

      <span class="icon">💵</span>

      <span class="text"
            data-i18n="repayments">

        Repayments

      </span>

    </a>

    <!-- TRANSACTIONS -->
    <a href="transactions.html"
       class="nav-item admin-only">

      <span class="icon">💱</span>

      <span class="text"
            data-i18n="transactions">

        Transactions

      </span>

    </a>
    
<!-- WITHDRAWALS -->
    <a href="withdrawals.html"
       class="nav-item admin-only">

      <span class="icon">💵</span>

      <span class="text"
            data-i18n="withdrawals">

        Withdrawals

      </span>

    </a>
    <!-- REPORTS -->
    <a href="reports.html"
       class="nav-item admin-only">

      <span class="icon">📄</span>

      <span class="text"
            data-i18n="reports">

        Reports

      </span>

    </a>

    <!-- USERS -->
    <a href="users.html"
       class="nav-item admin-only">

      <span class="icon">👤</span>

      <span class="text"
            data-i18n="users">

        Users

      </span>

    </a>

    <!-- SETTINGS -->
    <a href="settings.html"
       class="nav-item">

      <span class="icon">⚙️</span>

      <span class="text"
            data-i18n="settings">

        Settings

      </span>

    </a>

  </nav>

</aside>

<div class="container">

  <h1>⚙️ SETTINGS</h1>

  <!-- USER INFO -->
  <div class="selected-box">

    <h3>👤 Account Info</h3>

    <p id="userName">Loading...</p>
    <p id="userEmail">Loading...</p>
    <p id="userRole">Loading...</p>

  </div>

  <!-- PASSWORD RESET -->
  <div class="form-box">

    <h3>🔐 Change Password</h3>

    <input id="newPassword"
           type="password"
           class="input"
           placeholder="New Password">

    <button class="btn primary"
            onclick="changePassword()">

      Update Password

    </button>

  </div>

  <!-- ACTIONS -->
  <div style="margin-top:20px;">

    <button class="btn danger"
            onclick="logoutUser()">

      Logout

    </button>

  </div>

</div>

<script type="module" src="js/settings.js"></script>

</body>
</html>
