<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>System Settings</title>

  <link rel="stylesheet"
        href="css/style.css">

</head>

<body>

<div class="container">

  <h1>⚙️ SYSTEM SETTINGS</h1>

  <!-- SYSTEM INFO -->
  <section class="cards">

    <div class="card blue">

      <h3>System Version</h3>

      <p>v1.0 SACCO</p>

    </div>

    <div class="card green">

      <h3>Database</h3>

      <p>Firestore</p>

    </div>

    <div class="card orange">

      <h3>Security Mode</h3>

      <p>RBAC Enabled</p>

    </div>

  </section>

  <!-- ROLE SETTINGS -->
  <h2>Role Management</h2>

  <table class="table">

    <thead>

      <tr>

        <th>User</th>
        <th>Role</th>
        <th>Action</th>

      </tr>

    </thead>

    <tbody id="roleTable">

    </tbody>

  </table>

</div>

<script type="module"src="js/settings.js"></script>

</body>
</html>
