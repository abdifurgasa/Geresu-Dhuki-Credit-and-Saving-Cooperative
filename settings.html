<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Settings</title>

  <link rel="stylesheet" href="css/layout.css">
</head>

<body>

<div class="layout">

  <aside class="sidebar">
    <h2>SACCO</h2>
  </aside>

  <main class="main">

    <div class="topbar">
      <h2>Settings</h2>
    </div>

    <div class="content">

      <h3>Language</h3>

      <button onclick="setLang('en')">English</button>
      <button onclick="setLang('am')">Amharic</button>

      <br><br>

      <h3>Theme</h3>
      <button onclick="toggleTheme()">Toggle Dark Mode</button>

      <br><br>

      <button onclick="logout()">Logout</button>

    </div>

  </main>

</div>

<script src="js/settings.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
