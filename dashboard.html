<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACCO | Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f4f6f9;
        }
        /* Sidebar */
        .sidebar {
            width: 260px;
            background: linear-gradient(135deg, #1a3c34, #0e2a24);
            color: white;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            overflow-y: auto;
        }
        .logo {
            padding: 25px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        .logo i {
            font-size: 40px;
            color: #ffc107;
        }
        .logo h2 {
            margin-top: 10px;
        }
        .nav-item {
            padding: 12px 20px;
            margin: 5px 0;
        }
        .nav-item a {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.1);
            border-left: 3px solid #ffc107;
        }
        /* Main content */
        .main-content {
            margin-left: 260px;
            padding: 20px;
        }
        .header {
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #ffc107;
        }
        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #1a3c34;
        }
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .action-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .action-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .action-card i {
            font-size: 36px;
            color: #ffc107;
        }
        .table-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 400px;
        }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .close {
            float: right;
            font-size: 24px;
            cursor: pointer;
        }
        button {
            background: #1a3c34;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar span { display: none; }
            .main-content { margin-left: 70px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <i class="fas fa-piggy-bank"></i>
            <h2>SACCO</h2>
        </div>
        <div class="nav-item active"><a href="dashboard.html"><i class="fas fa-chart-line"></i> <span>Dashboard</span></a></div>
        <div class="nav-item"><a href="members.html"><i class="fas fa-users"></i> <span>Members</span></a></div>
        <div class="nav-item"><a href="savings.html"><i class="fas fa-coins"></i> <span>Savings</span></a></div>
        <div class="nav-item"><a href="loans.html"><i class="fas fa-hand-holding-usd"></i> <span>Loans</span></a></div>
        <div class="nav-item"><a href="withdrawals.html"><i class="fas fa-money-bill-wave"></i> <span>Withdrawals</span></a></div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Financial Dashboard</h1>
            <div>Welcome, Admin</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><h4>Total Members</h4><div class="value" id="totalMembers">0</div></div>
            <div class="stat-card"><h4>Total Savings</h4><div class="value" id="totalSavings">0 ETB</div></div>
            <div class="stat-card"><h4>Total Loans</h4><div class="value" id="totalLoans">0 ETB</div></div>
            <div class="stat-card"><h4>Total Withdrawals</h4><div class="value" id="totalWithdrawals">0 ETB</div></div>
        </div>

        <div class="actions-grid">
            <div class="action-card" onclick="location.href='members.html'"><i class="fas fa-user-plus"></i><h3>Add Member</h3></div>
            <div class="action-card" onclick="location.href='savings.html'"><i class="fas fa-coins"></i><h3>Record Savings</h3></div>
            <div class="action-card" onclick="location.href='loans.html'"><i class="fas fa-hand-holding-usd"></i><h3>Create Loan</h3></div>
            <div class="action-card" onclick="location.href='withdrawals.html'"><i class="fas fa-money-bill-wave"></i><h3>Withdrawal</h3></div>
        </div>

        <div class="table-container">
            <h3>Recent Members</h3>
            <table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Savings</th></tr></thead><tbody id="membersList"></tbody></table>
        </div>
    </div>

    <script>
        function loadData() {
            const members = JSON.parse(localStorage.getItem('members') || '[]');
            const savings = JSON.parse(localStorage.getItem('savings') || '[]');
            const loans = JSON.parse(localStorage.getItem('loans') || '[]');
            const withdrawals = JSON.parse(localStorage.getItem('withdrawals') || '[]');
            
            document.getElementById('totalMembers').innerText = members.length;
            let totalSavings = savings.reduce((s,item)=>s+item.amount,0);
            document.getElementById('totalSavings').innerText = totalSavings.toLocaleString()+' ETB';
            let totalLoans = loans.reduce((s,item)=>s+item.amount,0);
            document.getElementById('totalLoans').innerText = totalLoans.toLocaleString()+' ETB';
            let totalWithdrawals = withdrawals.reduce((s,item)=>s+item.amount,0);
            document.getElementById('totalWithdrawals').innerText = totalWithdrawals.toLocaleString()+' ETB';
            
            let html = '';
            members.slice(0,5).forEach(m => {
                let memberSavings = savings.filter(s=>s.memberId===m.id).reduce((s,item)=>s+item.amount,0);
                html += `<tr><td>${m.name}</td><td>${m.email}</td><td>${m.phone}</td><td>${memberSavings.toLocaleString()} ETB</td></tr>`;
            });
            document.getElementById('membersList').innerHTML = html || '<tr><td colspan="4">No members yet</td></tr>';
        }
        loadData();
        window.addEventListener('storage', loadData);
    </script>
</body>
</html>
