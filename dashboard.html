<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SACCO Dashboard</title>

<style>
body{margin:0;font-family:Arial;background:#f5f7fb;}

.sidebar{
  width:220px;
  height:100vh;
  background:white;
  position:fixed;
  padding:20px;
}

.main{
  margin-left:240px;
  padding:20px;
}

.card{
  background:white;
  padding:15px;
  margin:10px;
  border-radius:10px;
}
button{
  background:#2563eb;
  color:white;
  border:none;
  padding:8px;
}
</style>
</head>
<body>

<div class="sidebar">
  <h3>Menu</h3>
  <p>Dashboard</p>
</div>

<div class="main">

  <div class="card">
    <h3>Add Member</h3>
    <input id="mname" placeholder="Name">
    <input id="mphone" placeholder="Phone">
    <button onclick="addMember()">Add</button>
  </div>

  <div class="card">
    <h3>Add Savings</h3>
    <input id="mid" placeholder="Member ID">
    <input id="amount" placeholder="Amount">
    <button onclick="addSaving()">Save</button>
  </div>

  <div class="card">
    <h3>Total Savings</h3>
    <p id="total">0</p>
  </div>

</div>

<script type="module">
import { auth, db } from "./js/firebase.js";

import {
  collection,
  addDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* MEMBER */
window.addMember = async function(){

  const name = document.getElementById("mname").value;
  const phone = document.getElementById("mphone").value;

  await addDoc(collection(db,"members"),{
    name, phone
  });

  alert("Member added");
}

/* SAVINGS */
window.addSaving = async function(){

  const mid = document.getElementById("mid").value;
  const amount = Number(document.getElementById("amount").value);

  await addDoc(collection(db,"savings"),{
    memberId: mid,
    amount,
    date: new Date()
  });

  loadTotal();
}

/* TOTAL */
async function loadTotal(){

  const snap = await getDocs(collection(db,"savings"));

  let total = 0;

  snap.forEach(d=>{
    total += d.data().amount;
  });

  document.getElementById("total").innerText = total;
}

loadTotal();
</script>

</body>
</html>
