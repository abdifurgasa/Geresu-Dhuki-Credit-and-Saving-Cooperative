<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACCO | Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="sidebar">
    <!-- Sidebar will be loaded by layout.js -->
</div>

<div class="main-content">
    <div class="header">
        <!-- Header will be loaded by layout.js -->
    </div>

    <div class="quick-actions">
        <div class="action-card" onclick="window.location.href='members.html'">
            <i class="fas fa-user-plus"></i>
            <h3 data-i18n="dashboard.addMember">Add Member</h3>
            <p data-i18n="members.addNew">Register new member</p>
        </div>
        <div class="action-card" onclick="window.location.href='savings.html'">
            <i class="fas fa-save"></i>
            <h3 data-i18n="dashboard.recordSavings">Savings</h3>
            <p data-i18n="savings.title">Record member savings</p>
        </div>
        <div class="action-card" onclick="window.location.href='loans.html'">
            <i class="fas fa-hand-holding-usd"></i>
            <h3 data-i18n="dashboard.createLoan">Loans</h3>
            <p data-i18n="loans.applyNew">Create new loan</p>
        </div>
        <div class="action-card" onclick="window.location.href='withdrawals.html'">
            <i class="fas fa-money-bill-wave"></i>
            <h3 data-i18n="dashboard.processWithdrawal">Withdrawals</h3>
            <p data-i18n="withdrawals.process">Process withdrawals</p>
        </div>
    </div>

    <div class="performance-grid">
        <div class="kpi-card">
            <h4 data-i18n="dashboard.totalSavings">Savings (ETB)</h4>
            <div class="value" id="savingsValue">0</div>
            <div class="trend" id="savingsTrend">Loading...</div>
        </div>
        <div class="kpi-card">
            <h4 data-i18n="dashboard.totalLoans">Loans (ETB)</h4>
            <div class="value" id="loansValue">0</div>
            <div class="trend" id="loansTrend">Loading...</div>
        </div>
        <div class="kpi-card">
            <h4 data-i18n="dashboard.totalWithdrawals">Withdrawals (ETB)</h4>
            <div class="value" id="withdrawalsValue">0</div>
            <div class="trend" id="withdrawalsTrend">Loading...</div>
        </div>
        <div class="kpi-card">
            <h4 data-i18n="dashboard.totalProfit">Profit (ETB)</h4>
            <div class="value" id="profitValue">0</div>
            <div class="trend" id="profitTrend">Loading...</div>
        </div>
    </div>

    <div class="charts-row">
        <div class="chart-card">
            <h3 data-i18n="reports.loanPerformance">Loans vs Repayments</h3>
            <canvas id="loansRepaymentsChart"></canvas>
        </div>
        <div class="chart-card">
            <h3 data-i18n="reports.memberGrowth">Member Growth</h3>
            <canvas id="memberGrowthChart"></canvas>
        </div>
    </div>
</div>

<script type="module">
    import { db, collection, getDocs, query, where, Timestamp } from './js/firebase.js';
    import { initLayout, createSidebarHTML, createHeaderHTML } from './js/layout.js';
    import { formatCurrency } from './js/utils.js';
    import { t } from './js/i18n.js';
    
    // Load layout
    document.querySelector('.sidebar').innerHTML = createSidebarHTML();
    document.querySelector('.header').innerHTML = createHeaderHTML();
    initLayout();
    
    let loansChart = null;
    let growthChart = null;
    
    async function loadDashboardData() {
        try {
            // Get savings total
            const savingsSnapshot = await getDocs(collection(db, "savings"));
            let totalSavings = 0;
            savingsSnapshot.forEach(doc => totalSavings += doc.data().amount || 0);
            document.getElementById('savingsValue').innerText = formatCurrency(totalSavings);
            
            // Get loans total
            const loansSnapshot = await getDocs(collection(db, "loans"));
            let totalLoans = 0;
            loansSnapshot.forEach(doc => totalLoans += doc.data().principal || doc.data().amount || 0);
            document.getElementById('loansValue').innerText = formatCurrency(totalLoans);
            
            // Get withdrawals total
            const withdrawalsSnapshot = await getDocs(collection(db, "withdrawals"));
            let totalWithdrawals = 0;
            withdrawalsSnapshot.forEach(doc => totalWithdrawals += doc.data().amount || 0);
            document.getElementById('withdrawalsValue').innerText = formatCurrency(totalWithdrawals);
            
            // Calculate profit
            const profit = (totalLoans * 0.12) - (totalWithdrawals * 0.02);
            document.getElementById('profitValue').innerText = formatCurrency(profit);
            
            // Load charts
            await loadCharts();
            
        } catch (error) {
            console.error("Error loading dashboard:", error);
        }
    }
    
    async function loadCharts() {
        const currentYear = new Date().getFullYear();
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        
        // Get monthly loans
        const loansSnapshot = await getDocs(query(collection(db, "loans"), where("year", "==", currentYear)));
        const monthlyLoans = new Array(12).fill(0);
        loansSnapshot.forEach(doc => {
            const month = (doc.data().month || new Date().getMonth() + 1) - 1;
            monthlyLoans[month] += doc.data().principal || doc.data().amount || 0;
        });
        
        // Get monthly repayments
        const repaymentsSnapshot = await getDocs(query(collection(db, "repayments"), where("year", "==", currentYear)));
        const monthlyRepayments = new Array(12).fill(0);
        repaymentsSnapshot.forEach(doc => {
            const month = (doc.data().month || new Date().getMonth() + 1) - 1;
            monthlyRepayments[month] += doc.data().amount || 0;
        });
        
        if (loansChart) loansChart.destroy();
        
        const ctx1 = document.getElementById('loansRepaymentsChart').getContext('2d');
        loansChart = new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: months,
                datasets: [
                    { label: t('loans.title'), data: monthlyLoans, backgroundColor: '#ffc107' },
                    { label: t('repayments.title'), data: monthlyRepayments, backgroundColor: '#1a3c34' }
                ]
            },
            options: {
                responsive: true,
                scales: { y: { beginAtZero: true, ticks: { callback: v => v.toLocaleString() + ' ETB' } } }
            }
        });
        
        // Member growth chart
        const membersSnapshot = await getDocs(collection(db, "members"));
        const monthlyMembers = new Array(12).fill(0);
        membersSnapshot.forEach(doc => {
            const joinDate = doc.data().createdAt || doc.data().joinDate;
            if (joinDate && joinDate.toDate) {
                const month = joinDate.toDate().getMonth();
                monthlyMembers[month]++;
            }
        });
        
        if (growthChart) growthChart.destroy();
        
        const ctx2 = document.getElementById('memberGrowthChart').getContext('2d');
        growthChart = new Chart(ctx2, {
            type: 'line',
            data: {
                labels: months,
                datasets: [{ label: t('members.title'), data: monthlyMembers, borderColor: '#ffc107', fill: true }]
            },
            options: { responsive: true, scales: { y: { beginAtZero: true, stepSize: 1 } } }
        });
    }
    
    loadDashboardData();
</script>

</body>
</html>
