<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title data-i18n="dashboard">
    Dashboard
  </title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- =========================
     SIDEBAR
========================= -->
<aside class="sidebar" id="sidebar">

  <!-- TOGGLE -->
  <button class="toggle-btn"
          onclick="toggleSidebar()">

    ☰

  </button>

  <!-- LOGO -->
  <h2 class="logo">
    🏦 SACCO
  </h2>

  <!-- NAVIGATION -->
  <nav class="nav">

    <a href="dashboard.html"
       class="nav-item active">

      <span class="icon">📊</span>

      <span class="text"
            data-i18n="dashboard">

      </span>

    </a>

    <a href="members.html"
       class="nav-item">

      <span class="icon">👥</span>

      <span class="text"
            data-i18n="members">

      </span>

    </a>

    <a href="savings.html"
       class="nav-item">

      <span class="icon">💰</span>

      <span class="text"
            data-i18n="savings">

      </span>

    </a>

    <a href="loans.html"
       class="nav-item">

      <span class="icon">🏦</span>

      <span class="text"
            data-i18n="loans">

      </span>

    </a>

    <a href="transactions.html"
       class="nav-item">

      <span class="icon">💱</span>

      <span class="text">

        Transactions

      </span>

    </a>

    <a href="reports.html"
       class="nav-item">

      <span class="icon">📄</span>

      <span class="text"
            data-i18n="reports">

      </span>

    </a>

    <a href="users.html"
       class="nav-item">

      <span class="icon">👤</span>

      <span class="text">

        Users

      </span>

    </a>

    <a href="settings.html"
       class="nav-item">

      <span class="icon">⚙️</span>

      <span class="text"
            data-i18n="settings">

      </span>

    </a>

  </nav>

</aside>

<!-- =========================
     MAIN CONTENT
========================= -->
<main class="main">

  <!-- TOPBAR -->
  <div class="topbar">

    <!-- LEFT -->
    <div>

      <h2>
        Financial dashboard
      </h2>

    </div>

    <!-- RIGHT -->
    <div style="
      display:flex;
      gap:10px;
      align-items:center;
    ">

      <!-- ROLE -->
      <div class="selected-box"
           style="
             padding:10px 15px;
             margin:0;
           ">

        👑 Admin

      </div>

      <!-- LANGUAGE -->
      <select id="langSelect"
              class="lang-select"
              onchange="changeLang(this.value)">

        <option value="EN">EN</option>
        <option value="AM">AM</option>
        <option value="OR">OR</option>

      </select>

      <!-- LOGOUT -->
      <button class="btn logout-btn">

        Logout

      </button>

    </div>

  </div>

  <!-- PAGE TITLE -->
  <div style="margin-top:25px;">

    <h1 data-i18n="overview">

      Dashboard overview

    </h1>

    <p data-i18n="welcome">

      Welcome to SACCO Management System

    </p>

  </div>

  <!-- =========================
       DASHBOARD CARDS
  ========================= -->
  <section class="cards">

    <!-- MEMBERS -->
    <div class="card blue">

      <h3 data-i18n="totalMembers">

        Total Members

      </h3>

      <p id="members">

        0

      </p>

    </div>

    <!-- SAVINGS -->
    <div class="card green">

      <h3 data-i18n="totalSavings">

        Total Savings

      </h3>

      <p id="savings">

        0 ETB

      </p>

    </div>

    <!-- LOANS -->
    <div class="card orange">

      <h3 data-i18n="totalLoans">

        Total Loans

      </h3>

      <p id="loans">

        0 ETB

      </p>

    </div>

    <!-- PROFIT -->
    <div class="card purple">

      <h3 data-i18n="totalProfit">

        Total Profit

      </h3>

      <p id="profit">

        0 ETB

      </p>

    </div>

  </section>

  <!-- =========================
       QUICK ACTIONS
  ========================= -->
  <section style="margin-top:30px;">

    <h2>

      Quick actions

    </h2>

    <div class="cards">

      <a href="members.html"
         class="card teal"
         style="text-decoration:none;">

        <h3>Add new member</h3>

        <p>👥</p>

      </a>

      <a href="savings.html"
         class="card green"
         style="text-decoration:none;">

        <h3>Deposit savings</h3>

        <p>💰</p>

      </a>

      <a href="loans.html"
         class="card orange"
         style="text-decoration:none;">

        <h3>Create loan</h3>

        <p>🏦</p>

      </a>

      <a href="reports.html"
         class="card red"
         style="text-decoration:none;">

        <h3>View reports</h3>

        <p>📄</p>

      </a>

    </div>

  </section>

</main>

<!-- =========================
     SIDEBAR JS
========================= -->
<script>

function toggleSidebar() {

  document
    .getElementById("sidebar")
    .classList.toggle("collapsed");
}

</script>

<!-- =========================
     JS FILES
========================= -->
<script src="js/i18n.js"></script>

<script type="module"
        src="js/dashboard.js">

</script>

</body>
</html>
