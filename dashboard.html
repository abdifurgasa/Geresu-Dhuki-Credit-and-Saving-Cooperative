<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f5f7fb;
}

.topbar{
  background:#1e293b;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
}

.container{
  padding:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:10px;
  margin-bottom:15px;
}

.admin{
  border-left:5px solid #2563eb;
}

button{
  padding:8px 12px;
  background:red;
  color:white;
  border:none;
  border-radius:6px;
}
</style>

</head>

<body>

<div class="topbar">
  <h3>SACCO Dashboard</h3>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">

  <div class="card">
    <h3>Welcome</h3>
    <p id="roleText">Loading role...</p>
  </div>

  <div class="card admin" id="adminBox">
    <h3>Admin Panel</h3>
    <p>Only admin can see this</p>
  </div>

</div>

<script type="module">
import { auth, db } from "./js/firebase.js";

import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const roleText = document.getElementById("roleText");
const adminBox = document.getElementById("adminBox");

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  try {

    const snap = await getDoc(doc(db, "users", user.uid));

    if (!snap.exists()) {
      roleText.innerText = "Role missing, contact admin";
      adminBox.style.display = "none";
      return;
    }

    const role = snap.data().role;

    roleText.innerText = "Role: " + role;

    if (role !== "admin") {
      adminBox.style.display = "none";
    }

  } catch (err) {
    console.error(err);
    roleText.innerText = "Error loading role";
  }

});

window.logout = async function () {
  await signOut(auth);
  window.location.href = "index.html";
};
</script>

</body>
</html>
