<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title data-i18n="dashboard">Dashboard</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

    <h2 class="logo">SACCO</h2>

    <nav class="nav">

      <a href="dashboard.html" class="nav-item">
        <span class="icon">📊</span>
        <span class="text" data-i18n="dashboard"></span>
      </a>

      <a href="members.html" class="nav-item">
        <span class="icon">👥</span>
        <span class="text" data-i18n="members"></span>
      </a>

      <a href="savings.html" class="nav-item">
        <span class="icon">💰</span>
        <span class="text" data-i18n="savings"></span>
      </a>

      <a href="loans.html" class="nav-item">
        <span class="icon">🏦</span>
        <span class="text" data-i18n="loans"></span>
      </a>

      <a href="reports.html" class="nav-item">
        <span class="icon">📄</span>
        <span class="text" data-i18n="reports"></span>
      </a>

      <a href="settings.html" class="nav-item">
        <span class="icon">⚙️</span>
        <span class="text" data-i18n="settings"></span>
      </a>

    </nav>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOP BAR -->
    <div class="topbar">

      <div class="role-indicator">Admin</div>

      <div class="lang-box">
        <select id="langSelect" onchange="changeLang(this.value)">
          <option value="EN">EN</option>
          <option value="AM">AM</option>
          <option value="OR">OR</option>
        </select>
      </div>

    </div>

    <!-- HEADER -->
    <h1 data-i18n="overview"></h1>
    <p data-i18n="welcome"></p>

    <!-- CARDS -->
    <section class="cards">

      <div class="card">
        <h3 data-i18n="totalMembers"></h3>
        <p id="members">0</p>
      </div>

      <div class="card">
        <h3 data-i18n="totalSavings"></h3>
        <p id="savings">0 ETB</p>
      </div>

      <div class="card">
        <h3 data-i18n="totalLoans"></h3>
        <p id="loans">0 ETB</p>
      </div>

      <div class="card">
        <h3 data-i18n="totalProfit"></h3>
        <p id="profit">0 ETB</p>
      </div>

    </section>

  </main>

  <!-- JS -->
  <script src="js/i18n.js"></script>
  <script type="module" src="js/dashboard.js"></script>

</body>
</html>
