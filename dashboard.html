<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SACCO Dashboard</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:240px;
  background:#0f172a;
  color:#fff;
  height:100vh;
  padding:20px;
  transition:0.3s ease;
  overflow:hidden;
}

.sidebar h2{margin-bottom:20px;transition:0.3s}

.sidebar a{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  color:#cbd5e1;
  border-radius:8px;
  margin-bottom:5px;
  cursor:pointer;
  transition:0.2s;
  white-space:nowrap;
}

.sidebar a:hover,
.sidebar a.active{
  background:#2563eb;
  color:#fff;
}

.sidebar.collapsed{
  width:70px;
  padding:20px 10px;
}

.sidebar.collapsed a span,
.sidebar.collapsed h2{
  display:none;
}

.sidebar.collapsed a{
  justify-content:center;
  font-size:18px;
}

/* MAIN */
.main{flex:1;transition:0.3s}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:#fff;
  border-bottom:1px solid #ddd;
}

.topbar-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.logout-btn{
  background:#ef4444;
  color:#fff;
  border:none;
  padding:7px 12px;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
}
.logout-btn:hover{background:#dc2626;transform:translateY(-2px)}

/* CARDS - UPDATED FINTECH STYLE */
.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  padding:20px;
}

.card{
  padding:20px;
  border-radius:14px;
  color:#fff;
  box-shadow:0 6px 18px rgba(0,0,0,0.12);
  transition:0.3s ease;
}

.card:hover{
  transform:translateY(-10px) scale(1.02);
  box-shadow:0 18px 35px rgba(0,0,0,0.2);
}

.card:nth-child(1){background:linear-gradient(135deg,#3b82f6,#1d4ed8);}
.card:nth-child(2){background:linear-gradient(135deg,#22c55e,#15803d);}
.card:nth-child(3){background:linear-gradient(135deg,#f97316,#c2410c);}
.card:nth-child(4){background:linear-gradient(135deg,#a855f7,#6b21a8);}

.card h4{
  margin:0;
  opacity:0.9;
  font-weight:500;
}

.card h2{
  margin:10px 0 0 0;
  font-size:28px;
}

/* CONTENT */
.content{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
  padding:20px;
}

.box{
  background:#fff;
  padding:15px;
  border-radius:12px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:left;
}

.tag{padding:5px 10px;border-radius:10px;font-size:12px}
.green{background:#dcfce7;color:#166534}
.orange{background:#fed7aa;color:#9a3412}
.blue{background:#dbeafe;color:#1e40af}

/* QUICK ACTIONS */
.quick button{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:none;
  border-radius:10px;
  color:#fff;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:0.3s;
}

.quick button:hover{
  transform:translateY(-6px) scale(1.04);
  box-shadow:0 12px 25px rgba(0,0,0,0.25);
}

.quick button::before{
  content:"";
  position:absolute;
  top:0;
  left:-120%;
  width:100%;
  height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.4),transparent);
  transition:0.5s;
}

.quick button:hover::before{left:120%}

.b1{background:#3b82f6}
.b2{background:#16a34a}
.b3{background:#ea580c}
.b4{background:#9333ea}

select{padding:6px;border-radius:6px;border:1px solid #ddd}
.toggle-btn{background:#0f172a;color:#fff;border:none;padding:6px 10px;border-radius:6px;cursor:pointer}
</style>
</head>

<body>

<div class="sidebar" id="sidebar">
<h2 data-i18n="app">SACCO</h2>
<a class="active"><i class="fa fa-home"></i> <span data-i18n="dashboard">Dashboard</span></a>
<a><i class="fa fa-users"></i> <span data-i18n="members">Members</span></a>
<a><i class="fa fa-wallet"></i> <span data-i18n="savings">Savings</span></a>
<a><i class="fa fa-coins"></i> <span data-i18n="loans">Loans</span></a>
<a><i class="fa fa-chart-line"></i> <span data-i18n="reports">Reports</span></a>
<a><i class="fa fa-gear"></i> <span data-i18n="settings">Settings</span></a>
</div>

<div class="main">

<div class="topbar">
<button class="toggle-btn" onclick="toggleSidebar()">☰</button>
<h3 data-i18n="dashboard">Dashboard</h3>

<div class="topbar-right">
<select id="langSelect">
  <option value="en">EN</option>
  <option value="am">AM</option>
  <option value="om">OR</option>
</select>

<button class="logout-btn" onclick="logout()"><i class="fa fa-right-from-bracket"></i> Logout</button>
</div>
</div>

<div class="cards">
<div class="card"><h4 data-i18n="totalMembers">Total Members</h4><h2 id="mCount">0</h2></div>
<div class="card"><h4 data-i18n="totalSavings">Total Savings</h4><h2 id="sCount">0</h2></div>
<div class="card"><h4 data-i18n="totalLoans">Total Loans</h4><h2 id="lCount">0</h2></div>
<div class="card"><h4 data-i18n="totalProfit">Total Profit</h4><h2 id="pCount">0</h2></div>
</div>

<div class="content">
<div class="box">
<h3 data-i18n="recentTransactions">Recent Transactions</h3>
<table>
<tr><th>Type</th><th>Member</th><th>Amount</th><th>Date</th></tr>
<tbody id="tx"></tbody>
</table>
</div>

<div class="box quick">
<h3 data-i18n="quickActions">Quick Actions</h3>
<button class="b1"><i class="fa fa-user"></i> <span data-i18n="addMember">Add Member</span></button>
<button class="b2"><i class="fa fa-money-bill"></i> <span data-i18n="recordSavings">Record Savings</span></button>
<button class="b3"><i class="fa fa-coins"></i> <span data-i18n="createLoan">Create Loan</span></button>
<button class="b4"><i class="fa fa-file"></i> <span data-i18n="generateReport">Generate Report</span></button>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyCS-3e_WqGHNycDgvlXVkInaynTnvnplYE",
  authDomain: "geresu-dhuki-sacco.firebaseapp.com",
  projectId: "geresu-dhuki-sacco",
  storageBucket: "geresu-dhuki-sacco.firebasestorage.app",
  messagingSenderId: "944934938425",
  appId: "1:944934938425:web:caef23f2f3bb34c843eae8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ================= LOGOUT ================= */
window.logout = async ()=>{
  await signOut(auth);
  localStorage.clear();
  window.location.href="index.html";
};

/* ================= SIDEBAR ================= */
const sidebar=document.getElementById("sidebar");

function applySidebar(){
  const state=localStorage.getItem("sidebarState");
  if(state==="collapsed") sidebar.classList.add("collapsed");
}
applySidebar();

window.toggleSidebar=function(){
  sidebar.classList.toggle("collapsed");
  localStorage.setItem("sidebarState",
    sidebar.classList.contains("collapsed")?"collapsed":"open");
};

/* ================= MEMBERS CRUD ================= */
window.addMember = async ()=>{
  let name = prompt("Member name");
  if(!name) return;

  await addDoc(collection(db,"members"),{
    name,
    created:new Date()
  });
};

window.deleteMember = async(id)=>{
  if(confirm("Delete member?")){
    await deleteDoc(doc(db,"members",id));
  }
};

/* ================= LOAD MEMBERS ================= */
let membersList = [];

onSnapshot(collection(db,"members"),snap=>{
  membersList = [];
  document.getElementById("mCount").innerText = snap.size;

  snap.forEach(d=>{
    membersList.push({id:d.id,...d.data()});
  });
});

/* ================= SAVINGS ================= */
window.recordSavings = async ()=>{
  if(membersList.length===0) return alert("No members");

  let name = prompt("Member name?");
  let amount = Number(prompt("Amount"));

  if(!name || !amount) return;

  await addDoc(collection(db,"transactions"),{
    type:"Saving",
    member:name,
    amount,
    date:new Date().toLocaleDateString()
  });
};

/* ================= LOANS ================= */
window.createLoan = async ()=>{
  let name = prompt("Member name?");
  let principal = Number(prompt("Loan amount"));
  let interest = Number(prompt("Interest %"));

  if(!principal || !interest) return;

  let total = principal + (principal * interest/100);

  await addDoc(collection(db,"loans"),{
    member:name,
    principal,
    total,
    interest
  });

  alert("Loan Total: "+total);
};

/* ================= DASHBOARD ================= */
onSnapshot(collection(db,"transactions"),snap=>{
  let html="";
  let savings=0;

  snap.forEach(d=>{
    let t=d.data();
    if(t.type==="Saving") savings+=t.amount;

    html+=`<tr>
      <td>${t.type}</td>
      <td>${t.member}</td>
      <td>${t.amount}</td>
      <td>${t.date||""}</td>
    </tr>`;
  });

  document.getElementById("tx").innerHTML=html;
  document.getElementById("sCount").innerText=savings;
});

/* ================= LOANS TOTAL ================= */
onSnapshot(collection(db,"loans"),snap=>{
  let total=0;
  let profit=0;

  snap.forEach(d=>{
    let l=d.data();
    total+=l.total||0;
    profit+=(l.total - l.principal)||0;
  });

  document.getElementById("lCount").innerText=total;
  document.getElementById("pCount").innerText=profit;
});

/* ================= QUICK ACTIONS LINK ================= */
document.querySelector(".b1").onclick = addMember;
document.querySelector(".b2").onclick = recordSavings;
document.querySelector(".b3").onclick = createLoan;

/* ================= MULTI LANGUAGE (UNCHANGED) ================= */
const translations={
 en:{dashboard:"Dashboard",members:"Members",savings:"Savings",loans:"Loans",reports:"Reports",settings:"Settings",quickActions:"Quick Actions",totalMembers:"Total Members",totalSavings:"Total Savings",totalLoans:"Total Loans",totalProfit:"Total Profit",addMember:"Add Member",recordSavings:"Record Savings",createLoan:"Create Loan",generateReport:"Generate Report",recentTransactions:"Recent Transactions",app:"SACCO"},
 am:{dashboard:"ዳሽቦርድ",members:"አባላት",savings:"ቁጠባ",loans:"ብድር",reports:"ሪፖርቶች",settings:"ቅንብሮች",quickActions:"ፈጣን እርምጃዎች",totalMembers:"ጠቅላላ አባላት",totalSavings:"ጠቅላላ ቁጠባ",totalLoans:"ጠቅላላ ብድር",totalProfit:"ጠቅላላ ትርፍ",addMember:"አባል አክል",recordSavings:"ቁጠባ መዝግብ",createLoan:"ብድር ፍጠር",generateReport:"ሪፖርት ፍጠር",recentTransactions:"የቅርብ ግብይቶች",app:"ሲኤስኮ"},
 om:{dashboard:"Daashboordii",members:"Miseensota",savings:"Qusannaa",loans:"Liqii",reports:"Ripoortii",settings:"Sirna",quickActions:"Tarkaanfii Ariifachiisaa",totalMembers:"Waliigala Miseensota",totalSavings:"Waliigala Qusannaa",totalLoans:"Waliigala Liqii",totalProfit:"Waliigala Bu'aa",addMember:"Miseensa Dabaluu",recordSavings:"Qusannaa Galchuu",createLoan:"Liqii Uumuu",generateReport:"Ripoortii Uumuu",recentTransactions:"Hojiiwwan Dhihoo",app:"SACCO"}
};

const langSelect=document.getElementById("langSelect");
let lang=localStorage.getItem("lang")||"en";
langSelect.value=lang;

function applyLang(l){
 document.querySelectorAll("[data-i18n]").forEach(el=>{
   const k=el.getAttribute("data-i18n");
   if(translations[l] && translations[l][k]) el.innerText=translations[l][k];
 });
}
applyLang(lang);

langSelect.addEventListener("change",e=>{
 lang=e.target.value;
 localStorage.setItem("lang",lang);
 applyLang(lang);
});
</script>

</body>
</html>
