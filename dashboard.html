<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SACCO Dashboard</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f1f5f9;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:240px;
  background:#0f172a;
  color:#fff;
  height:100vh;
  padding:20px;
  transition:0.3s ease;
}

.sidebar a{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  color:#cbd5e1;
  border-radius:8px;
  margin-bottom:5px;
  cursor:pointer;
}

.sidebar a:hover,
.sidebar a.active{
  background:#2563eb;
  color:#fff;
}

.sidebar.collapsed{
  width:70px;
}

.sidebar.collapsed span,
.sidebar.collapsed h2{
  display:none;
}

/* MAIN */
.main{flex:1}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:#fff;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  padding:20px;
}

.card{
  padding:20px;
  border-radius:14px;
  color:#fff;
  animation:fadeUp 0.6s;
}

.card:hover{
  transform:translateY(-10px) scale(1.03);
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1;}
}

.card:nth-child(1){background:#3b82f6;}
.card:nth-child(2){background:#22c55e;}
.card:nth-child(3){background:#f97316;}
.card:nth-child(4){background:#a855f7;}

/* CONTENT */
.page{display:none;padding:20px;}
.page.active{display:block;}

.grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
  padding:20px;
}

.box{
  background:#fff;
  padding:15px;
  border-radius:12px;
}

/* QUICK */
.quick button{
  width:100%;
  margin-bottom:10px;
  padding:12px;
  border:none;
  color:#fff;
  border-radius:10px;
  cursor:pointer;
}

.b1{background:#3b82f6}
.b2{background:#16a34a}
.b3{background:#ea580c}
.b4{background:#9333ea}

table{width:100%}
td,th{padding:8px;border-bottom:1px solid #eee}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
<h2>SACCO</h2>

<a onclick="showPage('dashboard')" class="active">
<i class="fa fa-home"></i><span data-i18n="dashboard">Dashboard</span>
</a>

<a onclick="showPage('members')">
<i class="fa fa-users"></i><span data-i18n="members">Members</span>
</a>

<a onclick="showPage('savings')">
<i class="fa fa-wallet"></i><span data-i18n="savings">Savings</span>
</a>

<a onclick="showPage('loans')">
<i class="fa fa-coins"></i><span data-i18n="loans">Loans</span>
</a>

<a onclick="showPage('reports')">
<i class="fa fa-chart-line"></i><span data-i18n="reports">Reports</span>
</a>
</div>

<!-- MAIN -->
<div class="main">

<!-- TOP -->
<div class="topbar">
<button onclick="toggleSidebar()">☰</button>
<h3 id="title">Dashboard</h3>

<select id="lang">
<option value="en">EN</option>
<option value="am">AM</option>
<option value="om">OR</option>
</select>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="page active">

<div class="cards">
<div class="card"><h4 data-i18n="totalMembers">Members</h4><h2 id="mCount">0</h2></div>
<div class="card"><h4 data-i18n="totalSavings">Savings</h4><h2 id="sCount">0</h2></div>
<div class="card"><h4 data-i18n="totalLoans">Loans</h4><h2 id="lCount">0</h2></div>
<div class="card"><h4 data-i18n="totalProfit">Profit</h4><h2 id="pCount">0</h2></div>
</div>

<div class="grid">

<!-- TRANSACTIONS -->
<div class="box">
<h3>Recent Transactions</h3>
<table>
<thead>
<tr><th>Type</th><th>Member</th><th>Amount</th></tr>
</thead>
<tbody id="tx"></tbody>
</table>
</div>

<!-- QUICK ACTIONS -->
<div class="box quick">
<h3>Quick Actions</h3>
<button class="b1" onclick="showPage('members')">Add Member</button>
<button class="b2" onclick="showPage('savings')">Deposit</button>
<button class="b3" onclick="showPage('loans')">Loan</button>
<button class="b4" onclick="showPage('reports')">Report</button>
</div>

</div>
</div>

<!-- MEMBERS -->
<div id="members" class="page">
<h2>Members</h2>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<button onclick="addMember()">Add</button>

<table>
<thead>
<tr><th>Name</th><th>Phone</th><th>Actions</th></tr>
</thead>
<tbody id="memberTable"></tbody>
</table>
</div>

<!-- SAVINGS -->
<div id="savings" class="page">
<h2>Savings</h2>

<select id="saveMember"></select>
<input id="saveAmount" type="number" placeholder="Amount">
<button onclick="addSavings()">Deposit</button>
</div>

<!-- LOANS -->
<div id="loans" class="page">
<h2>Loans</h2>

<select id="loanMember"></select>
<input id="loanAmount" type="number" placeholder="Amount">
<input id="interest" type="number" placeholder="Interest %">

<h3>Total: <span id="loanTotal">0</span></h3>

<button onclick="calculateLoan()">Calculate</button>
<button onclick="saveLoan()">Save</button>
</div>

<!-- REPORT -->
<div id="reports" class="page">
<h2>Reports</h2>
<p>Coming next step...</p>
</div>

</div>

<script type="module" src="js/app.js"></script>

<script>
function showPage(p){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.getElementById(p).classList.add("active");
 document.getElementById("title").innerText = p.toUpperCase();
}

function toggleSidebar(){
 document.getElementById("sidebar").classList.toggle("collapsed");
}
</script>

</body>
</html>
