<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SACCO Dashboard</title>

<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<!-- CHART JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div>
      <div class="logo">
        <h2>SACCO</h2>
        <p>Admin Panel</p>
      </div>

      <nav class="menu">
        <ul>
          <li class="active"><span>Dashboard</span></li>
          <li><span>Members</span></li>
          <li><span>Savings</span></li>
          <li><span>Loans</span></li>
          <li><span>Transactions</span></li>
          <li><span>Reports</span></li>
          <li><span>Settings</span></li>
        </ul>
      </nav>
    </div>

    <div class="logout" onclick="logout()">Logout</div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOPBAR -->
    <header class="topbar">
      <h2>Admin Dashboard</h2>
      <div>👤 Admin</div>
    </header>

    <!-- CONTENT -->
    <section class="content">

      <!-- CARDS -->
      <div class="cards">

        <div class="card members">
          <div>
            <p>Total Members</p>
            <h2 id="membersCount">0</h2>
          </div>
        </div>

        <div class="card savings">
          <div>
            <p>Total Savings</p>
            <h2 id="savingsTotal">$0</h2>
          </div>
        </div>

        <div class="card loans">
          <div>
            <p>Total Loans</p>
            <h2 id="loansTotal">$0</h2>
          </div>
        </div>

        <div class="card profit">
          <div>
            <p>Net Profit</p>
            <h2 id="profitTotal">$0</h2>
          </div>
        </div>

      </div>

      <!-- CHARTS -->
      <div class="charts-grid">

        <div class="chart-box">
          <h3>Savings Trend</h3>
          <canvas id="savingsChart"></canvas>
        </div>

        <div class="chart-box">
          <h3>Loans vs Repayments</h3>
          <canvas id="loanChart"></canvas>
        </div>

        <div class="chart-box">
          <h3>Members Growth</h3>
          <canvas id="memberChart"></canvas>
        </div>

      </div>

    </section>

  </main>

</div>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/dashboard.js"></script>
<script type="module" src="js/analytics.js"></script>

</body>
</html>
