<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SACCO Dashboard</title>

<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body>

<div class="layout">

<!-- ================= SIDEBAR ================= -->
<aside class="sidebar">

  <div class="logo">
    <h2>SACCO</h2>
    <p>Admin Panel</p>
  </div>

  <nav class="menu">
    <ul>
      <li class="active"><a href="dashboard.html"><i class="fas fa-home"></i><span>Dashboard</span></a></li>
      <li><a href="members.html"><i class="fas fa-users"></i><span>Members</span></a></li>
      <li><a href="savings.html"><i class="fas fa-piggy-bank"></i><span>Savings</span></a></li>
      <li><a href="loans.html"><i class="fas fa-hand-holding-dollar"></i><span>Loans</span></a></li>
      <li><a href="reports.html"><i class="fas fa-chart-line"></i><span>Reports</span></a></li>
    </ul>
  </nav>

</aside>

<!-- ================= MAIN ================= -->
<main class="main">

  <div class="topbar">
    <h2>Admin Dashboard</h2>
  </div>

  <!-- WRAPPED DASHBOARD -->
  <div class="dashboard-wrapper">

    <!-- CARDS -->
    <div class="cards">

      <div class="card members">
        <div class="card-inner">
          <div>
            <p>Total Members</p>
            <h2 id="membersCount">0</h2>
          </div>
          <div class="card-icon"><i class="fas fa-users"></i></div>
        </div>
      </div>

      <div class="card savings">
        <div class="card-inner">
          <div>
            <p>Total Savings</p>
            <h2 id="savingsTotal">$0</h2>
          </div>
          <div class="card-icon"><i class="fas fa-piggy-bank"></i></div>
        </div>
      </div>

      <div class="card loans">
        <div class="card-inner">
          <div>
            <p>Total Loans</p>
            <h2 id="loansTotal">$0</h2>
          </div>
          <div class="card-icon"><i class="fas fa-hand-holding-dollar"></i></div>
        </div>
      </div>

      <div class="card profit">
        <div class="card-inner">
          <div>
            <p>Net Profit</p>
            <h2 id="profitTotal">$0</h2>
          </div>
          <div class="card-icon"><i class="fas fa-chart-line"></i></div>
        </div>
      </div>

    </div>

  </div>

</main>

</div>

</body>
</html>
