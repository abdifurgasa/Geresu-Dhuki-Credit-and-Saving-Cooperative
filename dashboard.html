<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SACCO | Dashboard</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head>
<body><div class="sidebar"></div><div class="main-content"><div class="header"></div><div id="globalAlert" class="alert" style="display:none"></div>
<div class="quick-actions"><div class="action-card" onclick="location.href='members.html'"><i class="fas fa-user-plus"></i><h3 data-i18n="dashboard.addMember">Add Member</h3><p>Register new member</p></div>
<div class="action-card" onclick="location.href='savings.html'"><i class="fas fa-coins"></i><h3 data-i18n="dashboard.recordSavings">Record Savings</h3><p>Record member savings</p></div>
<div class="action-card" onclick="location.href='loans.html'"><i class="fas fa-hand-holding-usd"></i><h3 data-i18n="dashboard.createLoan">Create Loan</h3><p>Create new loan</p></div>
<div class="action-card" onclick="location.href='withdrawals.html'"><i class="fas fa-money-bill-wave"></i><h3 data-i18n="dashboard.processWithdrawal">Withdrawals</h3><p>Process withdrawals</p></div></div>
<div class="performance-grid"><div class="kpi-card"><h4 data-i18n="dashboard.totalMembers">Total Members</h4><div class="value" id="totalMembers">0</div></div>
<div class="kpi-card"><h4 data-i18n="dashboard.totalSavings">Total Savings</h4><div class="value" id="totalSavings">0 ETB</div></div>
<div class="kpi-card"><h4 data-i18n="dashboard.totalLoans">Total Loans</h4><div class="value" id="totalLoans">0 ETB</div></div>
<div class="kpi-card"><h4 data-i18n="dashboard.totalWithdrawals">Total Withdrawals</h4><div class="value" id="totalWithdrawals">0 ETB</div></div></div>
<div class="charts-row"><div class="chart-card"><h3>Savings Trend</h3><canvas id="savingsChart"></canvas></div><div class="chart-card"><h3>Loan Performance</h3><canvas id="loanChart"></canvas></div></div></div>
<script type="module">
import { initLayout, db, collection, getDocs, formatCurrency } from "./js/app.js";
initLayout();
let savingsChart, loanChart;
async function loadStats(){
    const membersSnap = await getDocs(collection(db,"members"));
    document.getElementById('totalMembers').innerText = membersSnap.size;
    const savingsSnap = await getDocs(collection(db,"savings"));
    let totalSavings=0; savingsSnap.forEach(d=>totalSavings+=d.data().amount||0);
    document.getElementById('totalSavings').innerHTML = formatCurrency(totalSavings);
    const loansSnap = await getDocs(collection(db,"loans"));
    let totalLoans=0; loansSnap.forEach(d=>totalLoans+=d.data().amount||0);
    document.getElementById('totalLoans').innerHTML = formatCurrency(totalLoans);
    const withdrawalsSnap = await getDocs(collection(db,"withdrawals"));
    let totalWithdrawals=0; withdrawalsSnap.forEach(d=>totalWithdrawals+=d.data().amount||0);
    document.getElementById('totalWithdrawals').innerHTML = formatCurrency(totalWithdrawals);
    // Charts
    const monthly = Array(12).fill(0);
    savingsSnap.forEach(d=>{ let m = d.data().month || new Date().getMonth()+1; monthly[m-1] += d.data().amount||0; });
    if(savingsChart) savingsChart.destroy();
    savingsChart = new Chart(document.getElementById('savingsChart'),{type:'line',data:{labels:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],datasets:[{label:'Savings',data:monthly,borderColor:'#1a3c34',fill:true}]}});
    const loanMonthly = Array(12).fill(0);
    loansSnap.forEach(d=>{ let m = d.data().month || new Date().getMonth()+1; loanMonthly[m-1] += d.data().amount||0; });
    if(loanChart) loanChart.destroy();
    loanChart = new Chart(document.getElementById('loanChart'),{type:'bar',data:{labels:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],datasets:[{label:'Loans Issued',data:loanMonthly,backgroundColor:'#ffc107'}]}});
}
loadStats();
</script></body></html>
