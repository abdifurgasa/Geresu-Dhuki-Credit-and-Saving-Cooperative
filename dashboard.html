<!-- ================= MODAL FORM ================= -->
<style>
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.4);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-content{
  background:#fff;
  padding:20px;
  border-radius:10px;
  width:300px;
}
.modal input{
  width:100%;
  margin:5px 0;
  padding:8px;
}
</style>

<div class="modal" id="formModal">
  <div class="modal-content">
    <h3 id="formTitle">Add</h3>
    <input id="fName" placeholder="Name">
    <input id="fAmount" placeholder="Amount">
    <input id="fInterest" placeholder="Interest % (Loan only)">
    <button onclick="saveData()">Save</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, addDoc, onSnapshot,
  doc, deleteDoc, updateDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */
const app = initializeApp({
  apiKey: "AIza...",
  authDomain: "geresu-dhuki-sacco.firebaseapp.com",
  projectId: "geresu-dhuki-sacco"
});
const db = getFirestore(app);
const auth = getAuth(app);

let currentType = "";
let editId = null;
let role = "cashier";

/* AUTH ROLE */
onAuthStateChanged(auth, async (user)=>{
  if(!user) location.href="index.html";

  const snap = await getDoc(doc(db,"users",user.uid));
  if(snap.exists()) role = snap.data().role;
});

/* OPEN FORM */
function openForm(type,id=null,data=null){
  currentType = type;
  editId = id;
  document.getElementById("formModal").style.display="flex";

  if(data){
    fName.value=data.name;
    fAmount.value=data.amount||"";
    fInterest.value=data.interest||"";
  }else{
    fName.value="";
    fAmount.value="";
    fInterest.value="";
  }
}

/* SAVE DATA */
window.saveData = async ()=>{
  const name=fName.value;
  const amount=Number(fAmount.value);
  const interest=Number(fInterest.value);

  if(currentType==="member"){
    if(editId){
      await updateDoc(doc(db,"members",editId),{name});
    }else{
      await addDoc(collection(db,"members"),{name});
    }
  }

  if(currentType==="saving"){
    if(editId){
      await updateDoc(doc(db,"savings",editId),{name,amount});
    }else{
      await addDoc(collection(db,"savings"),{
        name,amount,date:new Date().toLocaleDateString()
      });
    }
  }

  if(currentType==="loan"){
    const total = amount + (amount*interest/100);

    if(editId){
      await updateDoc(doc(db,"loans",editId),{name,amount,interest,total});
    }else{
      await addDoc(collection(db,"loans"),{
        name,amount,interest,total,
        date:new Date().toLocaleDateString()
      });
    }
  }

  formModal.style.display="none";
};

/* MEMBERS TABLE */
onSnapshot(collection(db,"members"),snap=>{
  let html="";
  snap.forEach(d=>{
    const x=d.data();
    html+=`
    <tr>
      <td>${x.name}</td>
      <td>
        <button onclick="openForm('member','${d.id}',${JSON.stringify(x)})">Edit</button>
        <button onclick="del('members','${d.id}')">Delete</button>
      </td>
    </tr>`;
  });
  document.getElementById("members").innerHTML=html;
});

/* SAVINGS */
onSnapshot(collection(db,"savings"),snap=>{
  let html="",total=0;
  let arr=[];

  snap.forEach(d=>{
    const x=d.data();
    total+=x.amount;
    arr.push(x);

    html+=`
    <tr>
      <td>${x.name}</td>
      <td>${x.amount}</td>
      <td>
        <button onclick="openForm('saving','${d.id}',${JSON.stringify(x)})">Edit</button>
        <button onclick="del('savings','${d.id}')">Delete</button>
      </td>
    </tr>`;
  });

  document.getElementById("savings").innerHTML=html;
  document.getElementById("sCount").innerText=total;

  renderRecent(arr,"Saving");
});

/* LOANS */
onSnapshot(collection(db,"loans"),snap=>{
  let html="",total=0,profit=0;
  let arr=[];

  snap.forEach(d=>{
    const x=d.data();
    total+=x.total;
    profit+=x.total-x.amount;
    arr.push(x);

    html+=`
    <tr>
      <td>${x.name}</td>
      <td>${x.total}</td>
      <td>
        <button onclick="openForm('loan','${d.id}',${JSON.stringify(x)})">Edit</button>
        <button onclick="del('loans','${d.id}')">Delete</button>
      </td>
    </tr>`;
  });

  document.getElementById("loans").innerHTML=html;
  document.getElementById("lCount").innerText=total;
  document.getElementById("pCount").innerText=profit;

  renderRecent(arr,"Loan");
});

/* DELETE */
window.del = (col,id)=>{
  if(role!=="admin"){
    alert("Only admin can delete");
    return;
  }
  deleteDoc(doc(db,col,id));
};

/* RECENT ACTIONS */
function renderRecent(arr,type){
  let colors=["r1","r2","r3","r4","r5"];
  arr=arr.slice(-10).reverse();

  let html="";
  arr.forEach((x,i)=>{
    html+=`
    <tr class="${colors[i%5]}">
      <td>${x.name}</td>
      <td>${x.amount}</td>
      <td>${type}</td>
      <td>${x.date||""}</td>
    </tr>`;
  });

  document.getElementById("recent").innerHTML=html;
}

/* BUTTON LINKS */
document.querySelector(".b1").onclick=()=>openForm("member");
document.querySelector(".b2").onclick=()=>openForm("saving");
document.querySelector(".b3").onclick=()=>openForm("loan");

</script>
