<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title data-i18n="dashboard">Dashboard</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <!-- TOGGLE BUTTON -->
    <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

    <h2 data-i18n="dashboard">SACCO</h2>

    <a href="dashboard.html" data-i18n="dashboard"></a>
    <a href="members.html" data-i18n="members"></a>
    <a href="savings.html" data-i18n="savings"></a>
    <a href="loans.html" data-i18n="loans"></a>
    <a href="reports.html" data-i18n="reports"></a>
    <a href="transactions.html" data-i18n="transactions"></a>
    <a href="settings.html" data-i18n="settings"></a>

    <button class="logout" data-i18n="logout"></button>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <h1 data-i18n="overview"></h1>
    <p data-i18n="welcome"></p>

    <!-- CARDS -->
    <section class="cards">

      <div class="card">
        <h3 data-i18n="totalMembers"></h3>
        <p id="members">0</p>
      </div>

      <div class="card">
        <h3 data-i18n="totalSavings"></h3>
        <p id="savings">0 ETB</p>
      </div>

      <div class="card">
        <h3 data-i18n="totalLoans"></h3>
        <p id="loans">0 ETB</p>
      </div>

      <div class="card">
        <h3 data-i18n="totalProfit"></h3>
        <p id="profit">0 ETB</p>
      </div>

    </section>

  </main>

  <!-- SYSTEMS -->
  <script src="js/i18n.js"></script>
  <script type="module" src="js/dashboard.js"></script>

</body>
</html>
