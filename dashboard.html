<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SACCO Dashboard Pro</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
:root{
  --bg:#f5f7fb;
  --panel:#ffffff;
  --card1:#2563eb;
  --card2:#16a34a;
  --card3:#f97316;
  --card4:#a855f7;
  --text:#0f172a;
  --muted:#64748b;
  --sidebar:#ffffff;
  --border:#e2e8f0;
}
*{box-sizing:border-box;font-family:Arial;}
body{margin:0;background:var(--bg);color:var(--text);display:flex;}

/* Sidebar */
.sidebar{
  width:260px;
  background:var(--sidebar);
  height:100vh;
  padding:20px;
  transition:.3s;
  position:fixed;
  left:0;
  top:0;
  overflow:auto;
  border-right:1px solid var(--border);
}
.sidebar.collapsed{width:70px;}
.sidebar h2{font-size:18px;margin-bottom:20px;}
.menu a{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  color:var(--text);
  text-decoration:none;
  border-radius:8px;
}
.menu a:hover{background:#f1f5f9;}

.main{
  margin-left:260px;
  padding:20px;
  width:100%;
  transition:.3s;
}
.sidebar.collapsed ~ .main{margin-left:70px;}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}
.btn{
  background:#fff;
  border:1px solid var(--border);
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}
.card{
  padding:15px;
  border-radius:12px;
  color:white;
}
.card1{background:var(--card1)}
.card2{background:var(--card2)}
.card3{background:var(--card3)}
.card4{background:var(--card4)}

.content-grid{
  display:grid;
  grid-template-columns:1fr 2fr;
  gap:15px;
  margin-top:20px;
}

.actions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.action-card{
  padding:15px;
  border-radius:12px;
  color:white;
  cursor:pointer;
  font-weight:bold;
  display:flex;
  align-items:center;
  gap:10px;
}
.a1{background:#2563eb;}
.a2{background:#16a34a;}
.a3{background:#f97316;}
.a4{background:#a855f7;}

.table{
  margin-top:20px;
  background:var(--panel);
  padding:15px;
  border-radius:10px;
  border:1px solid var(--border);
}

table{width:100%;border-collapse:collapse;}
th,td{padding:10px;border-bottom:1px solid var(--border);}
th{color:var(--muted);text-align:left;}

tr:nth-child(even){background:#f8fafc;}
tr:nth-child(odd){background:#fff;}

.menu a.active{
  background:#2563eb;
  color:#fff;
  font-weight:bold;
  border-left:4px solid #1d4ed8;
}

.menu a.logout{
  color:#ef4444;
}
.menu a.logout:hover{
  background:#fee2e2;
}
</style>
</head>

<body>

<div class="sidebar" id="sidebar">
  <h2>SACCO</h2>
  <div class="menu">
    <a class="nav-item active">Dashboard</a>
    <a class="nav-item">Members</a>
    <a class="nav-item">Users</a>
    <a class="nav-item">Loans</a>
    <a class="nav-item">Transactions</a>
    <a class="nav-item">Reports</a>
    <a class="nav-item">Settings</a>
    <a class="nav-item logout" onclick="logout()">Logout</a>
  </div>
</div>

<div class="main">

  <div class="topbar">
    <button class="btn" onclick="toggleSidebar()"><i class="fa fa-bars"></i></button>
    <select class="btn" onchange="setLang(this.value)">
      <option value="en">EN</option>
      <option value="am">AM</option>
      <option value="om">OM</option>
    </select>
  </div>

  <div class="cards">
    <div class="card card1"><h3>Total Members</h3><p id="members">0</p></div>
    <div class="card card2"><h3>Total Savings</h3><p id="savings">0 ETB</p></div>
    <div class="card card3"><h3>Total Loans</h3><p id="loans">0 ETB</p></div>
    <div class="card card4"><h3>Total Profit</h3><p id="profit">0 ETB</p></div>
  </div>

  <div class="content-grid">

    <div class="actions">
      <div class="action-card a1" id="depositBtn">Deposit</div>
      <div class="action-card a2">Loan Calculator</div>
      <div class="action-card a3">Add Member</div>
      <div class="action-card a4">Reports</div>
    </div>

    <div class="table">
      <h3>Recent Transactions</h3>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Type</th>
            <th>Member</th>
            <th>Amount</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCS-3e_WqGHNycDgvlXVkInaynTnvnplYE",
  authDomain: "geresu-dhuki-sacco.firebaseapp.com",
  projectId: "geresu-dhuki-sacco",
  storageBucket: "geresu-dhuki-sacco.firebasestorage.app",
  messagingSenderId: "944934938425",
  appId: "1:944934938425:web:caef23f2f3bb34c843eae8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let role = null;

/* AUTH + ROLE CHECK */
onAuthStateChanged(auth, async (user)=>{
  if(!user){
    location.href="login.html";
    return;
  }

  const snap = await getDoc(doc(db,"users",user.uid));

  if(!snap.exists()){
    alert("No role assigned");
    await signOut(auth);
    location.href="login.html";
    return;
  }

  role = snap.data().role;
});

/* LOGOUT */
window.logout = ()=>signOut(auth).then(()=>location.href="login.html");

/* SAVINGS */
function calcSavings(data){
  let total = 0;

  data.forEach(t=>{
    const a = Number(t.amount||0);
    if(t.type==="Deposit") total += a;
    else if(t.type==="Loan") total -= a;
  });

  document.getElementById("savings").innerText = total.toFixed(2)+" ETB";
}

/* FIRESTORE */
const tbody = document.getElementById("tbody");

onSnapshot(collection(db,"transactions"),(snap)=>{
  tbody.innerHTML="";
  const all=[];

  snap.forEach(docu=>{
    const d = docu.data();
    all.push(d);

    tbody.innerHTML += `
      <tr>
        <td>${docu.id.slice(0,6)}</td>
        <td>${d.type}</td>
        <td>${d.member}</td>
        <td>${d.amount}</td>
        <td>${d.date}</td>
      </tr>
    `;
  });

  calcSavings(all);
});

/* ADD TRANSACTION (ADMIN ONLY) */
document.getElementById("depositBtn").onclick = async ()=>{

  if(role !== "admin"){
    alert("Access denied (Admin only)");
    return;
  }

  const member = prompt("Member");
  const amount = prompt("Amount");

  await addDoc(collection(db,"transactions"),{
    type:"Deposit",
    member,
    amount:Number(amount),
    date:new Date().toISOString().split("T")[0]
  });
};

/* UI */
window.toggleSidebar = ()=>{
  document.getElementById("sidebar").classList.toggle("collapsed");
};

</script>

</body>
</html>
