<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Loans</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

  <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

  <h2 class="logo">🏦 SACCO</h2>

  <nav class="nav">

    <a href="dashboard.html" class="nav-item">Dashboard</a>
    <a href="members.html" class="nav-item">Members</a>
    <a href="loans.html" class="nav-item active">Loans</a>

  </nav>

</aside>

<!-- MAIN -->
<main class="main">

  <div class="topbar">
    <h2>🏦 Loan Management</h2>
    <button class="add-btn" onclick="openModal()">➕ Create Loan</button>
  </div>

  <input type="text" id="searchInput" class="input" placeholder="Search loans...">

  <table class="table-modern">

    <thead>
      <tr>
        <th>Member</th>
        <th>Amount</th>
        <th>Interest Type</th>
        <th>Rate %</th>
        <th>Duration</th>
        <th>Total</th>
        <th>Remaining</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody id="loanTable"></tbody>

  </table>

</main>

<!-- MODAL -->
<div class="modal" id="loanModal">

  <div class="modal-box">

    <h3>Create Loan</h3>

    <form id="loanForm">

      <select id="member" class="input" required></select>

      <input type="number" id="amount" class="input" placeholder="Loan Amount" required>

      <input type="number" id="interest" class="input" placeholder="Interest %" required>

      <!-- INTEREST TYPE -->
      <select id="interestType" class="input" required>
        <option value="">Interest Type</option>
        <option value="simple">Simple</option>
        <option value="flat">Flat</option>
        <option value="compound">Compound</option>
      </select>

      <!-- DURATION -->
      <input type="number" id="durationValue" class="input" placeholder="Duration (e.g 12)" required>

      <select id="durationType" class="input" required>
        <option value="">Month / Year</option>
        <option value="months">Months</option>
        <option value="years">Years</option>
      </select>

      <button type="submit" class="save-btn">Save Loan</button>
      <button type="button" class="close-btn" onclick="closeModal()">Cancel</button>

    </form>

  </div>

</div>

<script src="js/layout.js"></script>
<script type="module" src="js/loans.js"></script>

<script>
function openModal(){ document.getElementById("loanModal").style.display="flex"; }
function closeModal(){ document.getElementById("loanModal").style.display="none"; }
</script>

</body>
</html>
