<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Loans System</title>

<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>

<body>

<div class="layout">

<aside class="sidebar"></aside>

<main class="main">

<div class="topbar">
  <h2>Loan Management</h2>
</div>

<section class="content">

<!-- CREATE LOAN -->
<div class="card">
  <h3>Create Loan</h3>

  <input id="memberName" placeholder="Member Name / Phone / ID">
  <input id="amount" type="number" placeholder="Principal">
  <input id="rate" type="number" placeholder="Interest %">
  <input id="months" type="number" placeholder="Months">

  <button onclick="addLoan()">Create Loan</button>
</div>

<!-- LOANS TABLE -->
<div class="card">
  <h3>Loans</h3>

  <table>
    <thead>
      <tr>
        <th>Member</th>
        <th>Balance</th>
        <th>EMI</th>
        <th>Penalty</th>
        <th>Status</th>
        <th>View</th>
      </tr>
    </thead>

    <tbody id="loanTable"></tbody>
  </table>
</div>

<!-- SCHEDULE -->
<div class="card">
  <h3>Repayment Schedule</h3>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Due</th>
        <th>EMI</th>
        <th>Principal</th>
        <th>Interest</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody id="scheduleTable"></tbody>
  </table>
</div>

</section>

</main>
</div>

<script type="module" src="js/loans.js"></script>
<script src="js/layout.js"></script>

</body>
</html>
