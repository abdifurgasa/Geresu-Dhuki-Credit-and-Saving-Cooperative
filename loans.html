<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Loans System</title>

<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>

<body>

<div class="layout">

  <aside class="sidebar"></aside>

  <main class="main">

    <div class="topbar">
      <h2>Loan Management</h2>
    </div>

    <section class="content">

      <!-- FORM -->
      <div class="card">

        <h3>Create Loan</h3>

        <select id="memberSelect"></select>

        <input id="amount" type="number" placeholder="Principal Amount">

        <input id="rate" type="number" placeholder="Interest %">

        <input id="months" type="number" placeholder="Months">

        <button onclick="addLoan()">Create Loan</button>

      </div>

      <!-- TABLE -->
      <div class="transactions">

        <h3>Loan Records</h3>

    <table>
  <thead>
    <tr>
      <th>Member</th>
      <th>Principal</th>
      <th>Interest</th>
      <th>Total</th>
      <th>Monthly</th>
      <th>Due Date</th>
      <th>Penalty</th>
      <th>Balance</th>
      <th>Status</th>
    </tr>
  </thead>

  <tbody id="loanTable"></tbody>
</table>

      </div>

    </section>

  </main>

</div>

<script type="module" src="js/loans.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
