<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loans Module</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="main">

  <h2>🏦 Loans Management</h2>

  <!-- =========================
       SEARCH MEMBER
  ========================= -->
  <div class="search-container">

    <input
      type="text"
      id="searchMember"
      class="input"
      placeholder="Search member..."
    >

    <div id="searchResults" class="search-results"></div>

  </div>

  <!-- SELECTED MEMBER -->
  <div id="selectedMember" class="selected-box">
    👤 Select member first
  </div>

  <!-- =========================
       LOAN FORM
  ========================= -->
  <form id="loanForm" class="modal-box">

    <input type="number" id="principal" class="input" placeholder="Loan Amount" required>

    <input type="number" id="rate" class="input" placeholder="Interest Rate %" required>

    <input type="number" id="time" class="input" placeholder="Duration" required>

    <select id="timeType" class="input">
      <option value="months">Months</option>
      <option value="years">Years</option>
    </select>

    <select id="interestType" class="input">
      <option value="simple">Simple</option>
      <option value="compound">Compound</option>
      <option value="flat">Flat</option>
    </select>

    <button type="submit" class="save-btn">
      Create Loan
    </button>

  </form>

  <!-- =========================
       LOANS TABLE
  ========================= -->
  <div class="table-card">

    <table class="table-modern">

      <thead>
        <tr>
          <th>Member</th>
          <th>Principal</th>
          <th>Interest</th>
          <th>Total</th>
          <th>Remaining</th>
          <th>Type</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="loansTable"></tbody>

    </table>

  </div>

</main>

<script type="module" src="js/loans.js"></script>

</body>
</html>
