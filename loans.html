<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Loan System</title>

  <link rel="stylesheet"
        href="css/style.css">

</head>

<body>

<div class="container">

  <!-- PAGE TITLE -->
  <h1>🏦 LOAN MANAGEMENT SYSTEM</h1>

  <!-- SEARCH -->
  <div class="search-container">

    <input id="memberSearch"
           class="input"
           placeholder="Search member by Name / Phone / NID">

    <button class="btn primary"
            onclick="searchMembers()">

      Search

    </button>

  </div>

  <!-- SEARCH RESULTS -->
  <div id="searchResults"
       class="search-results"></div>

  <!-- SELECTED MEMBER -->
  <div id="selectedMember"
       class="selected-box">

    No member selected

  </div>

  <!-- LOAN FORM -->
  <div class="loan-form">

    <!-- AMOUNT -->
    <input id="loanAmount"
           class="input"
           type="number"
           placeholder="Loan Amount">

    <!-- INTEREST -->
    <input id="interestRate"
           class="input"
           type="number"
           placeholder="Interest Rate %">

    <!-- DURATION -->
    <input id="duration"
           class="input"
           type="number"
           placeholder="Loan Duration">

    <!-- PERIOD TYPE -->
    <select id="durationType"
            class="input">

      <option value="months">
        Months
      </option>

      <option value="years">
        Years
      </option>

    </select>

    <!-- CALCULATE BUTTON -->
    <button class="btn blue-btn"
            onclick="calculateLoan()">

      Calculate Loan

    </button>

  </div>

  <!-- LOAN SUMMARY -->
  <div class="selected-box">

    <p>
      Monthly Payment:
      <strong id="monthlyPayment">
        0 ETB
      </strong>
    </p>

    <p>
      Total Repayment:
      <strong id="totalRepayment">
        0 ETB
      </strong>
    </p>

    <p>
      Total Interest:
      <strong id="totalInterest">
        0 ETB
      </strong>
    </p>

  </div>

  <!-- CREATE -->
  <button class="btn success"
          onclick="createLoan()">

    Create Loan

  </button>

  <!-- TABLE -->
  <table class="table">

    <thead>

      <tr>

        <th>Member</th>
        <th>Amount</th>
        <th>Interest</th>
        <th>Duration</th>
        <th>Monthly</th>
        <th>Total</th>
        <th>Paid</th>
        <th>Remaining</th>
        <th>Status</th>

      </tr>

    </thead>

    <tbody id="loanTable">

    </tbody>

  </table>

</div>

<script type="module"src="js/loans.js"></script>
<script type="module" src="js/auth-guard.js"></script>
</body>
</html>
