<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Loan System</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

  <h1>🏦 LOAN MANAGEMENT SYSTEM</h1>

  <!-- SEARCH MEMBER -->
  <div class="search-container">

    <input id="memberSearch"
           class="input"
           placeholder="Search member by Name / Phone / NID">

    <button class="btn primary"
            onclick="searchMembers()">

      Search

    </button>

  </div>

  <!-- RESULTS -->
  <div id="searchResults"
       class="search-results"></div>

  <!-- SELECTED MEMBER -->
  <div id="selectedMember"
       class="selected-box">

    No member selected

  </div>

  <!-- LOAN FORM -->
  <div class="form-box">

    <input id="loanAmount"
           class="input"
           placeholder="Loan Amount">

    <input id="interest"
           class="input"
           placeholder="Interest % (e.g. 10)">

    <button class="btn success"
            onclick="createLoan()">

      Create Loan

    </button>

  </div>

  <!-- LOANS TABLE -->
  <table class="table">

    <thead>

      <tr>

        <th>Member</th>
        <th>Amount</th>
        <th>Interest</th>
        <th>Total</th>
        <th>Paid</th>
        <th>Remaining</th>
        <th>Status</th>

      </tr>

    </thead>

    <tbody id="loanTable">

    </tbody>

  </table>

</div>

<script type="module" src="js/loans.js"></script>

</body>
</html>
