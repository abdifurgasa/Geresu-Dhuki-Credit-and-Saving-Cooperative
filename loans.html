<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="loans">Loans</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

  <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
  <h2 class="logo">🏦 SACCO</h2>

  <nav class="nav">

    <a href="dashboard.html">📊 Dashboard</a>
    <a href="members.html">👥 Members</a>
    <a href="savings.html">💰 Savings</a>
    <a href="loans.html" class="active">🏦 Loans</a>
    <a href="repayments.html">💵 Repayments</a>
    <a href="withdrawals.html">💸 Withdrawals</a>
    <a href="reports.html">📄 Reports</a>
    <a href="users.html">👤 Users</a>
    <a href="settings.html">⚙️ Settings</a>

  </nav>

</aside>

<!-- MAIN -->
<main class="main">

  <div class="topbar">
    <h2>🏦 Loan Management</h2>
    <div class="selected-box">👑 ADMIN</div>
  </div>

  <!-- SEARCH MEMBER -->
  <section class="card" style="margin-top:20px;">

    <h2>🔍 Select Member</h2>

    <input id="memberId" class="input" placeholder="Member ID">

  </section>

  <!-- LOAN FORM -->
  <section class="card" style="margin-top:20px;">

    <h2>➕ Create Loan</h2>

    <input id="amount" type="number" class="input" placeholder="Loan Amount">

    <input id="interest" type="number" class="input" placeholder="Interest %">

    <input id="duration" type="number" class="input" placeholder="Duration (months)">

    <button class="btn success" onclick="createLoan()">
      Create Loan
    </button>

  </section>

  <!-- TABLE -->
  <section class="card" style="margin-top:20px;">

    <h2>📜 Loan Records</h2>

    <table class="table">

      <thead>
        <tr>
          <th>Member</th>
          <th>Principal</th>
          <th>Interest</th>
          <th>Total</th>
          <th>Paid</th>
          <th>Remaining</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="loanTable"></tbody>

    </table>

  </section>

</main>

<script src="js/layout.js"></script>
<script type="module" src="js/loans.js"></script>

</body>
</html>
