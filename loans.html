<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Loan System</title>

  <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

  <!-- =========================
       TITLE
  ========================= -->
  <h1>🏦 LOAN MANAGEMENT SYSTEM</h1>

  <!-- =========================
       SEARCH MEMBER
  ========================= -->
  <div class="search-container">

    <input id="memberSearch"
           class="input"
           placeholder="Search member (Name / Phone / NID)">

    <button class="btn primary"
            onclick="searchMembers()">

      Search

    </button>

  </div>

  <!-- SEARCH RESULTS -->
  <div id="searchResults"
       class="search-results"></div>

  <!-- SELECTED MEMBER -->
  <div id="selectedMember"
       class="selected-box">

    No member selected

  </div>

  <!-- =========================
       LOAN FORM
  ========================= -->
  <div class="loan-form">

    <!-- LOAN AMOUNT -->
    <input id="loanAmount"
           class="input"
           type="number"
           placeholder="Loan Amount">

    <!-- INTEREST RATE -->
    <input id="interestRate"
           class="input"
           type="number"
           placeholder="Interest Rate %">

    <!-- 🔥 INTEREST TYPE (IMPORTANT FIX) -->
    <select id="interestType"
            class="input">

      <option value="simple">
        Simple Interest
      </option>

      <option value="compound">
        Compound Interest
      </option>

      <option value="flat">
        Flat Rate Interest
      </option>

    </select>

    <!-- DURATION -->
    <input id="duration"
           class="input"
           type="number"
           placeholder="Loan Duration">

    <!-- DURATION TYPE -->
    <select id="durationType"
            class="input">

      <option value="months">
        Months
      </option>

      <option value="years">
        Years
      </option>

    </select>

    <!-- CALCULATE BUTTON -->
    <button class="btn blue-btn"
            onclick="calculateLoan()">

      Calculate Loan

    </button>

  </div>

  <!-- =========================
       LOAN SUMMARY
  ========================= -->
  <div class="selected-box">

    <p>
      Monthly Payment:
      <strong id="monthlyPayment">0 ETB</strong>
    </p>

    <p>
      Total Repayment:
      <strong id="totalRepayment">0 ETB</strong>
    </p>

    <p>
      Total Interest:
      <strong id="totalInterest">0 ETB</strong>
    </p>

  </div>

  <!-- =========================
       CREATE LOAN BUTTON
  ========================= -->
  <button class="btn success"
          onclick="createLoan()">

    Create Loan

  </button>

  <!-- =========================
       LOAN TABLE
  ========================= -->
  <table class="table">

    <thead>

      <tr>

        <th>Member</th>
        <th>Principal</th>
        <th>Interest</th>
        <th>Type</th>
        <th>Duration</th>
        <th>Monthly</th>
        <th>Total</th>
        <th>Paid</th>
        <th>Remaining</th>
        <th>Status</th>

      </tr>

    </thead>

    <tbody id="loanTable">

    </tbody>

  </table>

</div>

<!-- =========================
     SCRIPT
========================= -->
<script type="module" src="js/loans.js"></script>

</body>
</html>
